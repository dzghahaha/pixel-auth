<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台订单管理 - Pixel 订阅</title>
    <style>
        /* Modern SaaS Premium Design System */
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-text: #991b1b;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-900: #0f172a;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--slate-100);
            color: var(--slate-900);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.5;
        }

        .app-container {
            max-width: 1100px;
            width: 100%;
            margin: 32px auto;
            padding: 0 24px;
        }

        /* Navigation Bar */
        .admin-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            border: 1px solid var(--slate-200);
            flex-wrap: wrap;
        }

        .nav-item {
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            color: var(--slate-600);
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            color: var(--slate-900);
            background-color: var(--slate-100);
        }

        .nav-item.active {
            color: var(--primary);
            background-color: var(--primary-light);
        }

        .nav-item.logout {
            color: var(--danger);
            background-color: var(--danger-bg);
            margin-left: auto;
        }

        .nav-item.logout:hover {
            background-color: #fee2e2;
        }

        /* Header Style */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--slate-900);
            letter-spacing: -0.02em;
        }

        .diamond-icon {
            width: 22px;
            height: 22px;
            display: inline-block;
        }

        /* Card Container */
        .card {
            background: #ffffff;
            border: 1px solid var(--slate-200);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            overflow: hidden;
        }

        /* Search Panel */
        .search-combo {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            border: 1px solid var(--slate-300);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .search-input:focus, .status-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .status-select {
            padding: 10px 16px;
            border: 1px solid var(--slate-300);
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            font-size: 14px;
            min-width: 150px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-search {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .btn-search:hover {
            background-color: var(--primary-hover);
        }

        /* Data Table */
        .table-container {
            overflow-x: auto;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        .result-table th {
            background-color: var(--slate-50);
            color: var(--slate-600);
            font-weight: 600;
            padding: 14px 20px;
            border-bottom: 1px solid var(--slate-200);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .result-table td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--slate-200);
            color: var(--slate-700);
            vertical-align: middle;
        }

        .result-table tr:last-child td {
            border-bottom: none;
        }

        .result-table tr:hover td {
            background-color: var(--slate-50);
        }

        .account-td {
            font-weight: 500;
            color: var(--slate-900);
        }

        .time-td {
            color: var(--slate-400);
            font-size: 13px;
        }

        /* Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 9999px;
        }

        .status-badge.success {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .status-badge.pending {
            background-color: var(--warning-bg);
            color: var(--warning-text);
        }

        .status-badge.failed {
            background-color: var(--danger-bg);
            color: var(--danger-text);
        }

        /* Buttons */
        .btn-detail {
            background-color: var(--primary-light);
            color: var(--primary-hover);
            border: 1px solid var(--primary-border);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-detail:hover {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background-color: var(--slate-50);
            border-top: 1px solid var(--slate-200);
        }

        .btn-page {
            background-color: #ffffff;
            border: 1px solid var(--slate-300);
            color: var(--slate-700);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-page:hover:not(:disabled) {
            background-color: var(--slate-100);
            border-color: var(--slate-400);
        }

        .btn-page:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal Dialog Box */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: all 0.3s;
        }

        .modal.hidden {
            display: none !important;
        }

        .modal-content {
            background-color: #ffffff;
            width: 95%;
            max-width: 750px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--slate-200);
            animation: modalSlideUp 0.2s ease-out;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(10px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            font-weight: 700;
            font-size: 18px;
            color: var(--slate-900);
            border-bottom: 1px solid var(--slate-100);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header .close-btn {
            cursor: pointer;
            font-size: 24px;
            color: var(--slate-400);
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-header .close-btn:hover {
            color: var(--slate-900);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 13px;
        }

        /* Details Grid System */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            background: var(--slate-50);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--slate-200);
        }

        .detail-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            color: var(--slate-400);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            color: var(--slate-900);
            font-weight: 600;
            font-size: 13px;
            word-break: break-all;
        }

        /* History Listing Inside Modal */
        .inner-table-container {
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            overflow: hidden;
            max-height: 250px;
            overflow-y: auto;
        }

        .inner-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .inner-table th {
            background-color: var(--slate-50);
            color: var(--slate-600);
            font-weight: 600;
            padding: 10px 14px;
            border-bottom: 1px solid var(--slate-200);
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.05em;
        }

        .inner-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--slate-200);
            color: var(--slate-700);
            vertical-align: middle;
        }

        .inner-table tr:last-child td {
            border-bottom: none;
        }

        /* Edit Sub-Record Panel */
        .edit-record-panel {
            background: #ffffff;
            border: 2px solid var(--primary-border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
        }

        .edit-panel-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-hover);
            border-bottom: 1px solid var(--slate-100);
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--slate-700);
        }

        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--slate-300);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .edit-panel-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-cancel {
            background: #ffffff;
            border: 1px solid var(--slate-300);
            color: var(--slate-700);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            background-color: var(--slate-100);
        }

        .btn-submit {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none !important;
        }

        /* Toast notifications */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--slate-900);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            transition: opacity 0.3s;
        }
        .toast.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Mobile Responsive & Auto-Scaling System */
        @media (max-width: 768px) {
            .app-container {
                margin: 12px auto;
                padding: 0 12px;
            }
            .admin-nav {
                padding: 6px 12px;
                gap: 4px;
                border-radius: 8px;
            }
            .nav-item {
                padding: 6px 10px;
                font-size: 12px;
                border-radius: 6px;
            }
            .header-title {
                font-size: 18px;
            }
            .search-combo {
                padding: 12px;
                gap: 8px;
            }
            .search-input {
                font-size: 13px;
                padding: 8px 12px;
            }
            .status-select {
                font-size: 13px;
                padding: 8px 12px;
                min-width: 110px;
                flex: 1;
            }
            .btn-search {
                padding: 8px 16px;
                font-size: 13px;
                width: 100%;
            }
            .result-table th, .result-table td {
                padding: 10px 12px;
                font-size: 12px;
            }
            .btn-detail {
                padding: 4px 8px;
                font-size: 11px;
            }
            .modal-content {
                padding: 16px;
                gap: 12px;
                border-radius: 12px;
            }
            .modal-header {
                font-size: 16px;
                padding-bottom: 8px;
            }
            .details-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 12px;
                gap: 8px;
            }
            .detail-cell {
                gap: 2px;
            }
            .detail-value {
                font-size: 12px;
            }
            .inner-table th, .inner-table td {
                padding: 8px 10px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
            .pagination-container {
                flex-direction: column;
                gap: 12px;
                align-items: center;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item active">订单管理</a>
            <a href="/admin/keys.html" class="nav-item">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 管理图标 SVG -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="2" fill="#3b82f6" />
                    <rect x="3" y="14" width="7" height="7" rx="2" fill="#3b82f6" />
                    <rect x="14" y="3" width="7" height="7" rx="2" fill="#3b82f6" />
                    <rect x="14" y="14" width="7" height="7" rx="2" fill="#3b82f6" />
                </svg>
                <span class="header-title">订单数据管理中心</span>
            </div>
            <div class="header-right" id="admin-user-display" style="font-size:13px; color:var(--slate-600); font-weight: 500;">
                管理员: -
            </div>
        </header>

        <!-- 搜索过滤卡片 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="search-combo">
                <input type="text" id="search-query" class="search-input" placeholder="按系统卡密 / 账号 / 任务 ID 搜索...">
                <select id="filter-status" class="status-select">
                    <option value="">所有状态</option>
                    <option value="pending">排队中 (Pending)</option>
                    <option value="success">成功 (Success)</option>
                    <option value="failed">失败 (Failed)</option>
                </select>
                <button type="button" id="btn-search" class="btn-search">搜索筛选</button>
            </div>
        </div>

        <!-- 数据表格卡片 -->
        <div class="card">
            <div class="table-container">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>系统卡密</th>
                            <th>提交方式</th>
                            <th>最新账号</th>
                            <th>最新状态</th>
                            <th>供应商 / Task ID</th>
                            <th>首次提交时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 32px; color: var(--slate-400);">正在加载订单列表数据...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页栏 -->
            <div class="pagination-container">
                <button type="button" id="btn-prev-page" class="btn-page" disabled>上一页</button>
                <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--slate-600);">
                    第 <input type="number" id="input-page-num" min="1" value="1" style="width: 52px; text-align: center; padding: 4px; border: 1px solid var(--slate-300); border-radius: 6px; font-size:13px; outline:none; font-weight: 600; color: var(--slate-900);"> / <span id="total-pages-span">1</span> 页 (共 <span id="total-count-span">0</span> 条)
                </div>
                <button type="button" id="btn-next-page" class="btn-page" disabled>下一页</button>
            </div>
        </div>
    </div>

    <!-- 详情和编辑历史弹窗 -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span>卡密提交详情记录</span>
                <span id="close-modal" class="close-btn">&times;</span>
            </div>
            <div class="modal-body">
                <!-- 卡密基础信息网络栅格 -->
                <div class="details-grid">
                    <div class="detail-cell">
                        <span class="detail-label">系统卡密</span>
                        <span id="detail-card" class="detail-value">-</span>
                    </div>
                    <div class="detail-cell">
                        <span class="detail-label">供应商原始卡密</span>
                        <span id="detail-vendor-key" class="detail-value" style="font-family: monospace;">-</span>
                    </div>
                    <div class="detail-cell">
                        <span class="detail-label">提交方式</span>
                        <span id="detail-mode" class="detail-value">-</span>
                    </div>
                    <div class="detail-cell">
                        <span class="detail-label">卡密供应商</span>
                        <span id="detail-vendor" class="detail-value">-</span>
                    </div>
                    <div class="detail-cell">
                        <span class="detail-label">首次提交时间</span>
                        <span id="detail-created" class="detail-value">-</span>
                    </div>
                </div>

                <!-- 历史提交尝试列表 -->
                <div id="history-section" style="margin-top: 6px; display: flex; flex-direction: column; gap: 8px;">
                    <h4 style="font-size: 13px; font-weight: 700; color: var(--slate-900); padding-left: 2px;">尝试提交历史记录</h4>
                    <div class="inner-table-container">
                        <table class="inner-table">
                            <thead>
                                <tr>
                                    <th>账号明细</th>
                                    <th>状态</th>
                                    <th>备注/优惠链接</th>
                                    <th>提交时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="history-table-body">
                                <!-- 动态插入 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 单个记录修改面板 (隐藏) -->
                <div id="edit-section" class="edit-record-panel hidden">
                    <div class="edit-panel-header">更新账号处理状态 (ID: <span id="edit-rec-id">-</span>)</div>
                    
                    <div class="info-item" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom: 4px;">
                        <span style="color:var(--slate-400); font-weight:500;">账号用户名:</span>
                        <span id="edit-rec-user" style="font-weight:600; color:var(--slate-900);">-</span>
                    </div>

                    <div class="form-group">
                        <label for="input-status">更新状态</label>
                        <select id="input-status" class="form-input" style="cursor: pointer;">
                            <option value="pending">排队中 (pending)</option>
                            <option value="success">成功 (success)</option>
                            <option value="failed">失败 (failed)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="input-message">处理结果备注</label>
                        <input type="text" id="input-message" class="form-input" placeholder="如：充值成功，或者报错原因...">
                    </div>

                    <div class="form-group">
                        <label for="input-discount">优惠 Claimant 链接 (若有)</label>
                        <input type="text" id="input-discount" class="form-input" placeholder="以 https:// 开头的兑换/优惠链接">
                    </div>

                    <div class="edit-panel-footer">
                        <button type="button" id="btn-close-edit" class="btn-cancel">返回列表</button>
                        <button type="button" id="btn-save-record" class="btn-submit">保存更新</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="btn-close-modal" class="btn-cancel" style="padding: 8px 16px; font-size: 13px;">关闭详情</button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('table-body');
            const searchInput = document.getElementById('search-query');
            const statusSelect = document.getElementById('filter-status');
            const btnSearch = document.getElementById('btn-search');

            const btnPrev = document.getElementById('btn-prev-page');
            const btnNext = document.getElementById('btn-next-page');
            const inputPageNum = document.getElementById('input-page-num');
            const totalPagesSpan = document.getElementById('total-pages-span');
            const totalCountSpan = document.getElementById('total-count-span');

            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');

            // Modal elements
            const detailModal = document.getElementById('detail-modal');
            const closeModal = document.getElementById('close-modal');
            const btnCloseModal = document.getElementById('btn-close-modal');

            const detailCard = document.getElementById('detail-card');
            const detailVendorKey = document.getElementById('detail-vendor-key');
            const detailMode = document.getElementById('detail-mode');
            const detailVendor = document.getElementById('detail-vendor');
            const detailCreated = document.getElementById('detail-created');
            const historyTableBody = document.getElementById('history-table-body');

            // Edit section elements
            const editSection = document.getElementById('edit-section');
            const editRecId = document.getElementById('edit-rec-id');
            const editRecUser = document.getElementById('edit-rec-user');
            const inputStatus = document.getElementById('input-status');
            const inputMessage = document.getElementById('input-message');
            const inputDiscount = document.getElementById('input-discount');
            const btnCloseEdit = document.getElementById('btn-close-edit');
            const btnSaveRecord = document.getElementById('btn-save-record');

            let currentPage = 1;
            let totalPages = 1;
            const pageSize = 15;
            let currentOrders = [];
            let activeOrderID = null;
            let activeHistoryRecords = [];

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        loadOrders();
                    } else {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Format date
            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleString('zh-CN', { hour12: false });
            }

            // Fetch and render unique orders
            async function loadOrders() {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 32px; color: var(--slate-400);">正在读取数据...</td></tr>';
                const queryVal = searchInput.value.trim();
                const statusVal = statusSelect.value;

                try {
                    const url = `/api/admin/orders?page=${currentPage}&page_size=${pageSize}&query=${encodeURIComponent(queryVal)}&status=${statusVal}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        currentOrders = data.records || [];
                        const total = data.total || 0;
                        totalPages = Math.ceil(total / pageSize) || 1;

                        inputPageNum.value = currentPage;
                        totalPagesSpan.textContent = totalPages;
                        totalCountSpan.textContent = total;
                        btnPrev.disabled = currentPage <= 1;
                        btnNext.disabled = currentPage >= totalPages;

                        if (currentOrders.length === 0) {
                            tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 32px; color: var(--slate-400);">暂无符合条件的卡密订单记录</td></tr>';
                            return;
                        }

                        tableBody.innerHTML = '';
                        currentOrders.forEach(o => {
                            const tr = document.createElement('tr');
                            
                            let statusClass = 'pending';
                            let statusText = '排队中';
                            if (o.status === 'success') {
                                statusClass = 'success';
                                statusText = '成功';
                            } else if (o.status === 'failed') {
                                statusClass = 'failed';
                                statusText = '失败';
                            }

                            const vendorTask = o.vendor ? `${o.vendor}<br><span style="font-size:11px;color:var(--slate-400);">${o.task_id || '-'}</span>` : '-';

                            tr.innerHTML = `
                                <td>${o.id}</td>
                                <td style="font-family: monospace; font-weight: 600; color: var(--slate-900);">${o.card_secret}</td>
                                <td style="font-size:13px; color: var(--slate-600);">${o.mode === 'single' ? '单账号' : '批量'}</td>
                                <td class="account-td" style="font-size: 13px;">${o.username || '-'}</td>
                                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                                <td style="font-size:13px;">${vendorTask}</td>
                                <td class="time-td">${formatDate(o.created_at)}</td>
                                <td><button type="button" class="btn-detail" data-id="${o.id}">详情</button></td>
                            `;
                            tableBody.appendChild(tr);
                        });

                        // Attach event listeners to detail buttons
                        document.querySelectorAll('.btn-detail').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const id = parseInt(e.target.getAttribute('data-id'), 10);
                                openDetailModal(id);
                            });
                        });

                    } else {
                        showToast(data.message || '获取数据失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，无法加载数据');
                }
            }

            // Open Details Modal and fetch history
            async function openDetailModal(orderID) {
                const order = currentOrders.find(o => o.id === orderID);
                if (!order) return;

                activeOrderID = orderID;
                detailCard.textContent = order.card_secret;
                detailVendorKey.textContent = order.vendor_key || '暂无原始密钥';
                detailMode.textContent = order.mode === 'single' ? '单账号提交' : '批量提交';
                detailVendor.textContent = order.vendor || '自营渠道';
                detailCreated.textContent = formatDate(order.created_at);

                editSection.classList.add('hidden'); // Ensure edit section is closed initially
                historyTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:16px; color:var(--slate-400);">正在加载历史记录...</td></tr>';
                detailModal.classList.remove('hidden');

                await loadOrderHistory();
            }

            // Load Order History records
            async function loadOrderHistory() {
                try {
                    const res = await fetch(`/api/admin/orders/history?order_id=${activeOrderID}`);
                    const data = await res.json();
                    if (res.ok && data.success) {
                        activeHistoryRecords = data.records || [];
                        if (activeHistoryRecords.length === 0) {
                            historyTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:16px; color:var(--slate-400);">无历史提交记录</td></tr>';
                            return;
                        }

                        historyTableBody.innerHTML = '';
                        activeHistoryRecords.forEach(r => {
                            const tr = document.createElement('tr');
                            
                            let statusClass = 'pending';
                            let statusText = '排队中';
                            if (r.status === 'success') {
                                statusClass = 'success';
                                statusText = '成功';
                            } else if (r.status === 'failed') {
                                statusClass = 'failed';
                                statusText = '失败';
                            }

                            const detailsInfo = `
                                <div style="font-weight: 600; color: var(--slate-900);">${r.username}</div>
                                <div style="color:var(--slate-400); font-size:10px; margin-top:2px;">
                                    PWD: ${r.password} | 2FA: ${r.two_factor}
                                    ${r.extra_email ? ' | 辅邮: ' + r.extra_email : ''}
                                </div>
                            `;

                            const commentInfo = `
                                <div style="font-weight:500;">${r.message || '-'}</div>
                                ${r.discount_url ? `<div style="margin-top:2px;"><a href="${r.discount_url}" target="_blank" style="font-size:10px; color:var(--primary); text-decoration:none; word-break:break-all;">${r.discount_url}</a></div>` : ''}
                            `;

                            tr.innerHTML = `
                                <td style="padding:10px 14px; line-height:1.4;">${detailsInfo}</td>
                                <td style="padding:10px 14px;"><span class="status-badge ${statusClass}">${statusText}</span></td>
                                <td style="padding:10px 14px; line-height:1.3;">${commentInfo}</td>
                                <td style="font-size:11px; padding:10px 14px; color:var(--slate-400);">${formatDate(r.created_at)}</td>
                                <td style="padding:10px 14px;"><button type="button" class="btn-detail btn-edit-rec" data-rec-id="${r.id}" style="padding:4px 10px; font-size:11px;">编辑</button></td>
                            `;
                            historyTableBody.appendChild(tr);
                        });

                        // Bind edit events for historical records
                        document.querySelectorAll('.btn-edit-rec').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const recID = parseInt(e.target.getAttribute('data-rec-id'), 10);
                                openRecordEdit(recID);
                            });
                        });
                    } else {
                        historyTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:16px; color:var(--danger-text);">${data.message || '加载历史失败'}</td></tr>`;
                    }
                } catch (e) {
                    console.error(e);
                    historyTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:16px; color:var(--danger-text);">网络错误，无法加载历史记录</td></tr>';
                }
            }

            // Open sub-record editor
            function openRecordEdit(recID) {
                const rec = activeHistoryRecords.find(r => r.id === recID);
                if (!rec) return;

                editRecId.textContent = rec.id;
                editRecUser.textContent = rec.username;
                inputStatus.value = rec.status;
                inputMessage.value = rec.message || '';
                inputDiscount.value = rec.discount_url || '';

                editSection.classList.remove('hidden');
                editSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }

            // Close sub-record editor
            btnCloseEdit.addEventListener('click', () => {
                editSection.classList.add('hidden');
            });

            // Save Sub-record Edit
            btnSaveRecord.addEventListener('click', async () => {
                const id = parseInt(editRecId.textContent, 10);
                const status = inputStatus.value;
                const message = inputMessage.value.trim();
                const discount = inputDiscount.value.trim();

                btnSaveRecord.disabled = true;
                btnSaveRecord.innerText = '保存中...';

                try {
                    const res = await fetch('/api/admin/orders/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            record_id: id,
                            status: status,
                            message: message,
                            discount_url: discount
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast('历史记录修改成功！');
                        editSection.classList.add('hidden');
                        await loadOrderHistory(); // Refresh history table
                        loadOrders(); // Refresh main table to show latest state
                    } else {
                        showToast(data.message || '保存失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，修改失败');
                } finally {
                    btnSaveRecord.disabled = false;
                    btnSaveRecord.innerText = '保存修改';
                }
            });

            // Close modal actions
            function closeModalAction() {
                detailModal.classList.add('hidden');
                activeOrderID = null;
                activeHistoryRecords = [];
            }
            closeModal.addEventListener('click', closeModalAction);
            btnCloseModal.addEventListener('click', closeModalAction);

            // Search events
            btnSearch.addEventListener('click', () => {
                currentPage = 1;
                loadOrders();
            });
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentPage = 1;
                    loadOrders();
                }
            });

            // Pagination events
            inputPageNum.addEventListener('change', () => {
                let val = parseInt(inputPageNum.value, 10);
                if (isNaN(val) || val < 1) {
                    val = 1;
                }
                if (val > totalPages) {
                    val = totalPages;
                }
                currentPage = val;
                loadOrders();
            });

            inputPageNum.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    inputPageNum.blur();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadOrders();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadOrders();
                }
            });

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，注销失败');
                }
            });

            // Init load
            checkLogin();
        });
    </script>
</body>
</html>
