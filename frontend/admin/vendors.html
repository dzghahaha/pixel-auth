<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合作厂商管理 - Pixel 订阅管理</title>
    <link rel="stylesheet" href="./admin.css?v=1.0.2">
    <script src="./admin.js?v=1.0.8"></script>
    <style>
        .btn-action-delete {
            padding: 4px 10px;
            font-size: 11px;
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #fecaca;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }
        .btn-action-delete:hover {
            background-color: #fee2e2;
            border-color: #f87171;
        }
        .btn-action-delete:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            border-color: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- 页面加载过渡动画 -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="/admin/generate.html" class="nav-item">生成卡密</a>
            <a href="/admin/buy.html" class="nav-item">购买卡密</a>
            <a href="/admin/buy_records.html" class="nav-item">购买记录</a>
            <a href="/admin/vendors.html" class="nav-item active">合作厂商</a>
            <a href="/admin/devices.html" class="nav-item">设备列表</a>
            <a href="/admin/logs.html" class="nav-item">系统日志</a>
            <a href="/admin/faqs.html" class="nav-item">常见问题</a>
            <a href="/admin/settings.html" class="nav-item">系统设置</a>
            <a href="/admin/users.html" class="nav-item">用户管理</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 厂商管理 SVG 图标 -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                <span class="header-title">合作厂商管理</span>
            </div>
            <div class="header-right" id="admin-user-display" style="font-size:13px; color:var(--slate-600); font-weight: 500;">
                管理员: -
            </div>
        </header>

        <!-- 新增厂商卡片工具栏 -->
        <div class="card" style="margin-bottom: 20px; padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 13px; color: var(--text-secondary); font-weight: 500;">管理系统内用于生成及转换密钥的支付供应商通道</span>
                <button type="button" id="btn-open-create-modal" class="btn-submit" style="padding: 8px 16px; font-size: 13px;">+ 新增合作厂商</button>
            </div>
        </div>

        <!-- 数据表格卡片 -->
        <div class="card" style="padding: 0;">
            <div class="table-container">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>厂商代码 (Identifier)</th>
                            <th>厂商名称 (Display Name)</th>
                            <th>API 网关请求地址 (Gateway URL)</th>
                            <th>更新时间</th>
                            <th style="text-align: right; padding-right: 20px; width: 140px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="6" class="empty-tips">正在读取数据...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 新增/编辑厂商弹窗 (Modal) -->
    <div id="vendor-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 500px; width: 90%;">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">新增合作厂商</h3>
                <span class="close-btn" id="close-modal">&times;</span>
            </div>
            <div class="modal-body" style="padding: 20px;">
                <input type="hidden" id="vendor-id">
                
                <div class="form-group">
                    <label for="vendor-name">厂商代码 (英文代码，用于数据库映射)</label>
                    <input type="text" id="vendor-name" placeholder="例如：pass.aisale.one (内置 ai.deard.fun 不能改)">
                </div>
                <div class="form-group">
                    <label for="vendor-display-name">厂商显示名称 (中文名称，用于下拉选项)</label>
                    <input type="text" id="vendor-display-name" placeholder="例如：合作商卡网 (pass.aisale.one)">
                </div>
                <div class="form-group">
                    <label for="vendor-api-url">API 网关接口地址 (若为 ai.deard.fun 直接生成可留空)</label>
                    <input type="text" id="vendor-api-url" placeholder="例如：https://pass.aisale.one/gateway.php">
                </div>

                <button id="btn-save-vendor" class="btn-submit" style="margin-top: 16px; width: 100%; height: 38px; color: white;">保存提交</button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');
            const tableBody = document.getElementById('table-body');
            
            const vendorModal = document.getElementById('vendor-modal');
            const closeModal = document.getElementById('close-modal');
            const btnOpenCreateModal = document.getElementById('btn-open-create-modal');
            const btnSaveVendor = document.getElementById('btn-save-vendor');

            const modalTitle = document.getElementById('modal-title');
            const inputId = document.getElementById('vendor-id');
            const inputName = document.getElementById('vendor-name');
            const inputDisplayName = document.getElementById('vendor-display-name');
            const inputApiUrl = document.getElementById('vendor-api-url');

            let vendorRecords = []; // Cache list locally

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        window.applyNavPermissions(data.role, data.permissions);

                        // Proceed to load vendors
                        loadVendors();

                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.add('fade-out');
                        }
                    } else {
                        window.clearAuthCache();
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.clearAuthCache();
                    window.location.href = '/admin/login.html';
                }
            }

            async function loadVendors() {
                try {
                    const resp = await fetch('/api/admin/vendors');
                    const data = await resp.json();
                    
                    if (data.success && data.vendors) {
                        vendorRecords = data.vendors;
                        tableBody.innerHTML = '';
                        vendorRecords.forEach(v => {
                            const tr = document.createElement('tr');
                            
                            const isDeard = v.name === 'ai.deard.fun';
                            const date = new Date(v.updated_at);
                            const timeStr = date.toLocaleString('zh-CN', { hour12: false });

                            tr.innerHTML = `
                                <td>${v.id}</td>
                                <td style="font-family: monospace; font-weight: 600;">${v.name}</td>
                                <td style="font-weight: 600; color: var(--primary);">${v.display_name}</td>
                                <td style="font-size: 12px; color: var(--text-secondary); font-family: monospace;">${v.api_url || '<span style="color:#94a3b8; font-style:italic;">自营直发无需网关</span>'}</td>
                                <td style="font-size: 12px; color: var(--text-secondary);">${timeStr}</td>
                                <td style="text-align: right; padding-right: 20px;">
                                    <button class="btn-detail btn-edit-vendor" data-id="${v.id}">编辑</button>
                                    <button class="btn-action-delete btn-delete-vendor" data-id="${v.id}" ${isDeard ? 'disabled' : ''}>删除</button>
                                </td>
                            `;
                            tableBody.appendChild(tr);
                        });

                        // Bind edit events
                        document.querySelectorAll('.btn-edit-vendor').forEach(btn => {
                            btn.addEventListener('click', function() {
                                const id = parseInt(this.getAttribute('data-id'), 10);
                                openEditModal(id);
                            });
                        });

                        // Bind delete events
                        document.querySelectorAll('.btn-delete-vendor').forEach(btn => {
                            btn.addEventListener('click', function() {
                                const id = parseInt(this.getAttribute('data-id'), 10);
                                deleteVendor(id);
                            });
                        });
                    } else {
                        tableBody.innerHTML = '<tr><td colspan="6" class="empty-tips">暂无厂商数据</td></tr>';
                    }
                } catch (err) {
                    console.error(err);
                    tableBody.innerHTML = '<tr><td colspan="6" class="empty-tips" style="color: #ef4444;">加载数据失败，请刷新页面重试</td></tr>';
                }
            }

            // Open Modal for creation
            btnOpenCreateModal.addEventListener('click', () => {
                modalTitle.textContent = '新增合作厂商';
                inputId.value = '';
                inputName.value = '';
                inputName.disabled = false;
                inputDisplayName.value = '';
                inputApiUrl.value = '';
                vendorModal.classList.remove('hidden');
            });

            // Open Modal for edit
            function openEditModal(id) {
                const vendor = vendorRecords.find(v => v.id === id);
                if (!vendor) return;

                modalTitle.textContent = '编辑合作厂商';
                inputId.value = vendor.id;
                inputName.value = vendor.name;
                // deard identifier code cannot be changed
                inputName.disabled = (vendor.name === 'ai.deard.fun');
                inputDisplayName.value = vendor.display_name;
                inputApiUrl.value = vendor.api_url;
                
                vendorModal.classList.remove('hidden');
            }

            // Save vendor info
            btnSaveVendor.addEventListener('click', async () => {
                const id = inputId.value;
                const name = inputName.value.trim();
                const displayName = inputDisplayName.value.trim();
                const apiUrl = inputApiUrl.value.trim();

                if (!name || !displayName) {
                    showToast('厂商代码和厂商显示名称不能为空');
                    return;
                }

                const isEdit = id !== '';
                const url = isEdit ? '/api/admin/vendors/update' : '/api/admin/vendors/create';
                
                let body = {
                    name: name,
                    display_name: displayName,
                    api_url: apiUrl
                };
                if (isEdit) {
                    body.id = parseInt(id, 10);
                }

                btnSaveVendor.disabled = true;
                btnSaveVendor.textContent = '保存中...';

                try {
                    const resp = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await resp.json();
                    if (data.success) {
                        showToast(data.message || '保存成功');
                        vendorModal.classList.add('hidden');
                        await loadVendors();
                    } else {
                        showToast(data.message || '操作失败');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('网络通信失败，请稍后重试');
                } finally {
                    btnSaveVendor.disabled = false;
                    btnSaveVendor.textContent = '保存提交';
                }
            });

            // Delete vendor
            async function deleteVendor(id) {
                const vendor = vendorRecords.find(v => v.id === id);
                if (!vendor) return;

                if (!confirm(`确定要删除合作厂商 “${vendor.display_name}” 吗？\n删除后绑定该厂商的卡密将无法提交自动获取逻辑。`)) {
                    return;
                }

                try {
                    const resp = await fetch('/api/admin/vendors/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: id })
                    });
                    const data = await resp.json();
                    if (data.success) {
                        showToast(data.message);
                        await loadVendors();
                    } else {
                        showToast(data.message || '删除失败');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('网络错误，无法删除');
                }
            }

            // Close Modal
            closeModal.addEventListener('click', () => {
                vendorModal.classList.add('hidden');
            });

            // Click outside to close
            window.addEventListener('click', (e) => {
                if (e.target === vendorModal) {
                    vendorModal.classList.add('hidden');
                }
            });

            // Close modal on ESC press
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    vendorModal.classList.add('hidden');
                }
            });

            // Smooth link transitions
            document.querySelectorAll('a.nav-item').forEach(link => {
                if (link.getAttribute('href') !== '#' && !link.classList.contains('logout')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetUrl = link.getAttribute('href');
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.remove('fade-out');
                        }
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 180);
                    });
                }
            });

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    window.clearAuthCache();
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    window.clearAuthCache();
                    showToast('网络错误，注销失败');
                }
            });

            // Trigger init check
            checkLogin();
        });
    </script>
</body>
</html>
