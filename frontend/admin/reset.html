<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>密钥重置管理 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        .textarea-box {
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            min-height: 150px;
        }
        .readonly-box {
            background-color: var(--bg-highlight);
            color: var(--text-secondary);
            cursor: default;
        }
        .summary-actions {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item active">卡密重置</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 重置后台 SVG 图标 -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                <span class="header-title">系统卡密重置管理</span>
            </div>
        </header>

        <!-- 旧系统卡密输入卡片 -->
        <div class="card reset-container">
            <div class="card-header">
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <div class="card-title-group">
                    <span class="card-title">系统卡密失效重置</span>
                    <span class="card-subtitle">输入正在使用的有效系统卡密进行失效与迁移</span>
                </div>
            </div>

            <!-- 旧系统卡密列表 -->
            <div class="form-group required">
                <label for="textarea-old-keys">待重置的系统卡密列表（每行一个）</label>
                <textarea id="textarea-old-keys" class="textarea-box" placeholder="请输入旧系统卡密，每行一个..."></textarea>
            </div>

            <!-- 重置按钮 -->
            <button type="button" id="btn-reset" class="submit-btn" style="background-color: var(--danger); border-color: var(--danger);">
                <!-- 重置旋转箭头 SVG -->
                <svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; margin-right: 4px; display: inline-block; vertical-align: middle;">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                执行卡密失效与重置
            </button>
        </div>

        <!-- 输出展示卡片 -->
        <div class="card reset-container">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="card-title">生成的全新系统卡密</span>
                    <span class="card-subtitle">旧卡密已作废，原订单已迁移绑定至以下对应的新卡密</span>
                </div>
            </div>

            <div class="form-group">
                <textarea id="textarea-new-keys" class="textarea-box readonly-box" placeholder="点击提交后，重置后的新系统卡密将在此处显示，每行一个..." readonly></textarea>
            </div>

            <div class="summary-actions">
                <button type="button" id="btn-copy-new" class="btn-submit" style="width: 100%;">
                    复制新系统卡密列表
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const txtOldKeys = document.getElementById('textarea-old-keys');
            const txtNewKeys = document.getElementById('textarea-new-keys');
            const btnReset = document.getElementById('btn-reset');
            const btnCopy = document.getElementById('btn-copy-new');
            const toast = document.getElementById('toast');
            const btnLogout = document.getElementById('btn-logout');

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            // Check Login Status
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，注销失败');
                }
            });

            // Copy helper
            btnCopy.addEventListener('click', () => {
                const text = txtNewKeys.value.trim();
                if (!text) {
                    showToast('没有可复制的密钥');
                    return;
                }

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('复制成功！');
                    }).catch(err => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            });

            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('复制成功！');
                } catch (err) {
                    showToast('复制失败，请手动选择复制');
                }
                document.body.removeChild(textArea);
            }

            // Reset handler
            btnReset.addEventListener('click', async () => {
                const oldKeysRaw = txtOldKeys.value.trim();

                if (!oldKeysRaw) {
                    showToast('请输入要重置的旧系统卡密');
                    return;
                }

                const oldKeys = oldKeysRaw
                    .split('\n')
                    .map(k => k.trim())
                    .filter(k => k.length > 0);

                if (oldKeys.length === 0) {
                    showToast('没有有效的卡密');
                    return;
                }

                btnReset.disabled = true;
                const originalText = btnReset.innerHTML;
                btnReset.innerText = '正在执行失效与重置...';

                try {
                    const response = await fetch('/api/reset_keys', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            old_keys: oldKeys
                        })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        const newKeys = result.new_keys || [];
                        txtNewKeys.value = newKeys.join('\n');
                        showToast('系统卡密重置与迁移成功！');
                    } else {
                        showToast(result.message || '重置卡密失败');
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnReset.disabled = false;
                    btnReset.innerHTML = originalText;
                }
            });

            // Init check
            checkLogin();
        });
    </script>
</body>
</html>
