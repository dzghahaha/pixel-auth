<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录 - Pixel 订阅</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #090b11;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Backgrounds */
        .glow-sphere-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -150px;
            left: -150px;
            z-index: 1;
            filter: blur(60px);
        }

        .glow-sphere-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 70%);
            bottom: -200px;
            right: -150px;
            z-index: 1;
            filter: blur(80px);
        }

        /* Subtle grid pattern overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: 2;
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            z-index: 10;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .diamond-icon {
            width: 40px;
            height: 40px;
            color: var(--primary);
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.6));
        }

        .login-brand-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-light);
            text-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
        }

        .login-brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Glassmorphism Login Card */
        .login-card {
            background: rgba(22, 28, 45, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .login-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.05);
        }

        /* Form groups */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-group.required label::after {
            content: " *";
            color: var(--danger);
        }

        /* Input field container with relative positioning for icons */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: #64748b;
            pointer-events: none;
            transition: color 0.2s;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 42px; /* padding-left is 42px to make room for icon */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background-color: rgba(15, 23, 42, 0.4);
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #475569;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background-color: rgba(15, 23, 42, 0.6);
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        input[type="text"]:focus + .input-icon,
        input[type="password"]:focus + .input-icon {
            color: #818cf8;
        }

        /* Glowing Submit Button */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: 1px solid #4f46e5;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s, background 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            background: #1e293b;
            border-color: #1e293b;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Toasts */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: #ffffff;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>
    <div class="grid-overlay"></div>

    <div class="login-wrapper">
        <!-- 品牌标识 -->
        <div class="login-brand">
            <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <div style="display: flex; flex-direction: column; gap: 4px; text-align: center;">
                <span class="login-brand-title">Pixel 订阅系统</span>
                <span class="login-brand-subtitle">管理控制台</span>
            </div>
        </div>

        <!-- 登录表单卡片 -->
        <div class="card login-card" style="margin: 0; padding: 28px;">
            <!-- 用户名输入 -->
            <div class="form-group required" style="margin-bottom: 20px;">
                <label for="username">账号</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="请输入管理员用户名" autocomplete="username">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
            </div>

            <!-- 密码输入 -->
            <div class="form-group required" style="margin-bottom: 24px;">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>
            </div>

            <!-- 登录按钮 -->
            <button type="button" id="btn-login" class="submit-btn" style="width: 100%;">
                验证登录
            </button>
        </div>

        <!-- 返回链接 -->
        <div style="text-align: center;">
            <a href="/" style="font-size: 12px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.15s;" onmouseover="this.style.color='#ffffff'" onmouseout="this.style.color='var(--text-muted)'">← 返回前台提交页</a>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            const toast = document.getElementById('toast');

            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            btnLogin.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showToast('请填写所有必填项');
                    return;
                }

                btnLogin.disabled = true;
                const originalText = btnLogin.innerText;
                btnLogin.innerText = '正在验证登录中...';

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        showToast('登录成功！');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 500);
                    } else {
                        showToast(result.message || '登录失败，用户名或密码错误');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = originalText;
                }
            });

            // Enter key trigger
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnLogin.click();
                }
            });
        });
    </script>
</body>
</html>
