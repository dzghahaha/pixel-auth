<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        .login-card {
            max-width: 450px;
            margin: 12vh auto 0 auto;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 锁 SVG 图标 -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <span class="header-title">管理后台登录</span>
            </div>
        </header>

        <!-- 登录表单卡片 -->
        <div class="card login-card">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="card-title">安全验证</span>
                    <span class="card-subtitle">请输入管理员账号和密码以继续</span>
                </div>
            </div>

            <!-- 用户名输入 -->
            <div class="form-group required">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入管理员用户名">
            </div>

            <!-- 密码输入 -->
            <div class="form-group required">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>

            <!-- 登录按钮 -->
            <button type="button" id="btn-login" class="submit-btn" style="width: 100%; margin-top: 8px;">
                登录后台
            </button>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            const toast = document.getElementById('toast');

            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            btnLogin.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showToast('请填写所有必填项');
                    return;
                }

                btnLogin.disabled = true;
                const originalText = btnLogin.innerText;
                btnLogin.innerText = '正在验证登录中...';

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        showToast('登录成功！');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 500);
                    } else {
                        showToast(result.message || '登录失败，用户名或密码错误');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = originalText;
                }
            });

            // Enter key trigger
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnLogin.click();
                }
            });
        });
    </script>
</body>
</html>
