<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录 - Pixel 订阅</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .login-card {
            margin-top: 10vh;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 锁 SVG 图标 -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 20px; height: 20px;">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z" fill="#007aff"/>
                </svg>
                <span class="header-title">管理后台登录</span>
            </div>
        </header>

        <!-- 登录表单卡片 -->
        <div class="card login-card">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="card-title">安全验证</span>
                    <span class="card-subtitle">请输入管理员账号和密码以继续</span>
                </div>
            </div>

            <!-- 用户名输入 -->
            <div class="form-group required">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入管理员用户名" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none;">
            </div>

            <!-- 密码输入 -->
            <div class="form-group required">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none;">
            </div>

            <!-- 登录按钮 -->
            <button type="button" id="btn-login" class="submit-btn">
                登录后台
            </button>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            const toast = document.getElementById('toast');

            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            btnLogin.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showToast('请填写所有必填项');
                    return;
                }

                btnLogin.disabled = true;
                const originalText = btnLogin.innerText;
                btnLogin.innerText = '正在验证登录中...';

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        showToast('登录成功！');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 500);
                    } else {
                        showToast(result.message || '登录失败，用户名或密码错误');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = originalText;
                }
            });

            // Enter key trigger
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnLogin.click();
                }
            });
        });
    </script>
</body>
</html>
