<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .login-brand-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        .login-brand-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- 品牌标识 -->
        <div class="login-brand">
            <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 40px; height: 40px;">
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            <div style="display: flex; flex-direction: column; gap: 4px; text-align: center;">
                <span class="login-brand-title">Pixel 订阅系统</span>
                <span class="login-brand-subtitle">管理控制台</span>
            </div>
        </div>

        <!-- 登录表单卡片 -->
        <div class="card login-card" style="margin: 0; padding: 28px;">
            <!-- 用户名输入 -->
            <div class="form-group required" style="margin-bottom: 20px;">
                <label for="username">账号</label>
                <input type="text" id="username" placeholder="请输入管理员用户名" autocomplete="username">
            </div>

            <!-- 密码输入 -->
            <div class="form-group required" style="margin-bottom: 24px;">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <!-- 登录按钮 -->
            <button type="button" id="btn-login" class="submit-btn" style="width: 100%;">
                验证登录
            </button>
        </div>

        <!-- 返回链接 -->
        <div style="text-align: center;">
            <a href="/" style="font-size: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color 0.15s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-secondary)'">← 返回前台提交页</a>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            const toast = document.getElementById('toast');

            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            btnLogin.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showToast('请填写所有必填项');
                    return;
                }

                btnLogin.disabled = true;
                const originalText = btnLogin.innerText;
                btnLogin.innerText = '正在验证登录中...';

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        showToast('登录成功！');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 500);
                    } else {
                        showToast(result.message || '登录失败，用户名或密码错误');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = originalText;
                }
            });

            // Enter key trigger
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnLogin.click();
                }
            });
        });
    </script>
</body>
</html>
