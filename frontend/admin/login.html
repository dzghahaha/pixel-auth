<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理员登录 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }
        .login-card {
            width: 100%;
            margin: 0;
            padding: 28px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.15s ease;
        }
        input[type="text"],
        input[type="password"] {
            padding-left: 42px; /* make space for icon */
        }
        input[type="text"]:focus + .input-icon,
        input[type="password"]:focus + .input-icon {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- 品牌标识与创意插画 -->
        <div class="login-brand" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <svg viewBox="0 0 200 120" style="width: 100%; max-width: 140px; height: auto; margin-bottom: 4px; color: var(--primary);" fill="none" stroke="currentColor">
                <!-- 极简服务器/数据库线框图 -->
                <rect x="20" y="20" width="160" height="80" rx="8" stroke-width="2" />
                <line x1="20" y1="46" x2="180" y2="46" stroke-width="1.5" />
                <line x1="20" y1="73" x2="180" y2="73" stroke-width="1.5" />
                <circle cx="45" cy="33" r="3.5" fill="currentColor" />
                <circle cx="45" cy="59" r="3.5" fill="currentColor" />
                <circle cx="45" cy="86" r="3.5" fill="currentColor" />
                <!-- 动态脉冲线 -->
                <line x1="70" y1="33" x2="155" y2="33" stroke-width="2" stroke-dasharray="10,6" />
                <line x1="70" y1="59" x2="140" y2="59" stroke-width="2" stroke-dasharray="14,4" />
                <line x1="70" y1="86" x2="160" y2="86" stroke-width="2" stroke-dasharray="6,8" />
            </svg>
            <h2 style="font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em;">Pixel 订阅控制台</h2>
            <p style="font-size: 12px; color: var(--text-secondary);">请输入管理员账号与密码登录</p>
        </div>

        <!-- 登录表单卡片 -->
        <div class="card login-card">
            <!-- 用户名输入 -->
            <div class="form-group required" style="margin-bottom: 20px;">
                <label for="username">账号</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="请输入管理员用户名" autocomplete="username">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
            </div>

            <!-- 密码输入 -->
            <div class="form-group required" style="margin-bottom: 24px;">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                </div>
            </div>

            <!-- 登录按钮 -->
            <button type="button" id="btn-login" class="submit-btn" style="width: 100%;">
                验证登录
            </button>
        </div>

        <!-- 返回链接 -->
        <div style="text-align: center;">
            <a href="/" style="font-size: 12px; color: var(--text-secondary); text-decoration: none; font-weight: 600; transition: color 0.15s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-secondary)'">← 返回前台提交页</a>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const btnLogin = document.getElementById('btn-login');
            const toast = document.getElementById('toast');

            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            btnLogin.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    showToast('请填写所有必填项');
                    return;
                }

                btnLogin.disabled = true;
                const originalText = btnLogin.innerText;
                btnLogin.innerText = '正在验证登录中...';

                try {
                    const response = await fetch('/api/admin/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        showToast('登录成功！');
                        setTimeout(() => {
                            window.location.href = '/admin/dashboard.html';
                        }, 500);
                    } else {
                        showToast(result.message || '登录失败，用户名或密码错误');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.innerHTML = originalText;
                }
            });

            // Enter key trigger
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    btnLogin.click();
                }
            });
        });
    </script>
</body>
</html>
