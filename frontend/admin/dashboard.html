<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台数据仪表盘 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        /* Stats Grid System */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            padding: 20px;
            box-shadow: 2px 2px 0px var(--border-strong);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--border-strong);
        }

        .stat-card .card-icon-wrapper {
            position: absolute;
            right: 14px;
            top: 16px;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border-strong);
            background-color: var(--bg-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-card .card-icon {
            width: 20px;
            height: 20px;
            color: var(--text-primary);
        }

        .stat-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .stat-value {
            font-family: Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .stat-footer {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Chart Card */
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            padding: 24px;
            box-shadow: 3px 3px 0px var(--border-strong);
            margin-bottom: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-strong);
            padding-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chart-summary-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--bg-highlight);
            padding: 5px 12px;
            border: 1px solid var(--border-strong);
            font-weight: 600;
        }

        .summary-item .label {
            color: var(--text-secondary);
        }

        .summary-item .value {
            color: var(--text-primary);
        }

        .summary-item.success-item {
            background-color: var(--success-bg);
            border-color: var(--success);
        }
        .summary-item.success-item .label, .summary-item.success-item .value {
            color: var(--success);
        }

        .summary-item.danger-item {
            background-color: var(--danger-bg);
            border-color: var(--danger);
        }
        .summary-item.danger-item .label, .summary-item.danger-item .value {
            color: var(--danger);
        }

        .chart-title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chart-title {
            font-family: Georgia, serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chart-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 340px;
        }

        /* Mobile Responsive & Auto-Scaling System */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .stat-card {
                padding: 16px;
            }
            .stat-value {
                font-size: 24px;
            }
            .chart-card {
                padding: 16px;
            }
            .chart-container {
                height: 260px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 页面加载过渡动画 -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item active">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 仪表盘图标 SVG -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M9 3v18M3 9h18" />
                </svg>
                <span class="header-title">数据监控中心</span>
            </div>
            <div class="header-right" id="admin-user-display" style="font-size:13px; color:var(--slate-600); font-weight: 500;">
                管理员: -
            </div>
        </header>

        <!-- 今日统计模块 -->
        <div class="stats-grid">
            <!-- 总订单数 -->
            <div class="stat-card" style="border-top: 3px solid var(--text-secondary);">
                <div class="card-icon-wrapper" style="background-color: var(--bg-highlight);">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
                        <path d="m3.3 7 8.7 5 8.7-5M12 22V12" />
                    </svg>
                </div>
                <span class="stat-title">今日总订单</span>
                <span class="stat-value" id="stat-total">-</span>
                <span class="stat-footer">今日提交卡密数</span>
            </div>

            <!-- 成功订单数 -->
            <div class="stat-card" style="border-top: 3px solid var(--success);">
                <div class="card-icon-wrapper" style="background-color: var(--success-bg);">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="m9 12 2 2 4-4" />
                    </svg>
                </div>
                <span class="stat-title">成功订单数</span>
                <span class="stat-value" id="stat-success" style="color: var(--success);">-</span>
                <span class="stat-footer">已成功绑定订单</span>
            </div>

            <!-- 失败订单数 -->
            <div class="stat-card" style="border-top: 3px solid var(--danger);">
                <div class="card-icon-wrapper" style="background-color: var(--danger-bg);">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="m15 9-6 6M9 9l6 6" />
                    </svg>
                </div>
                <span class="stat-title">失败订单数</span>
                <span class="stat-value" id="stat-failed" style="color: var(--danger);">-</span>
                <span class="stat-footer">校验或绑定失败订单</span>
            </div>

            <!-- 其他状态订单 -->
            <div class="stat-card" style="border-top: 3px solid var(--warning);">
                <div class="card-icon-wrapper" style="background-color: var(--warning-bg);">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 6v6l4 2" />
                    </svg>
                </div>
                <span class="stat-title">其他状态订单</span>
                <span class="stat-value" id="stat-other" style="color: var(--warning);">-</span>
                <span class="stat-footer">排队处理中订单</span>
            </div>

            <!-- 成功率 -->
            <div class="stat-card" style="border-top: 3px solid var(--border-strong);">
                <div class="card-icon-wrapper" style="background-color: var(--bg-highlight);">
                    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                </div>
                <span class="stat-title">今日成功率</span>
                <span class="stat-value" id="stat-rate" style="color: var(--text-primary);">-</span>
                <span class="stat-footer">成功订单 / 总订单</span>
            </div>
        </div>

        <!-- 近30天订单趋势（趋势图） -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title-group">
                    <span class="chart-title">近30天订单趋势</span>
                    <span class="chart-subtitle">系统每日订单数量变化曲线</span>
                </div>
                <!-- 30天汇总 -->
                <div class="chart-summary-group">
                    <div class="summary-item">
                        <span class="label">30天总订单</span>
                        <span class="value" id="summary-30d-total">-</span>
                    </div>
                    <div class="summary-item success-item">
                        <span class="label">成功</span>
                        <span class="value" id="summary-30d-success">-</span>
                    </div>
                    <div class="summary-item danger-item">
                        <span class="label">失败</span>
                        <span class="value" id="summary-30d-failed">-</span>
                    </div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        loadStats();
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.add('fade-out');
                        }
                    } else {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Fetch statistics
            async function loadStats() {
                try {
                    const res = await fetch('/api/admin/dashboard/stats');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        document.getElementById('stat-total').textContent = data.today.total;
                        document.getElementById('stat-success').textContent = data.today.success;
                        document.getElementById('stat-failed').textContent = data.today.failed;
                        document.getElementById('stat-other').textContent = data.today.other;
                        document.getElementById('stat-rate').textContent = data.today.success_rate + '%';
                        
                        document.getElementById('summary-30d-total').textContent = data.summary_30d.total;
                        document.getElementById('summary-30d-success').textContent = data.summary_30d.success;
                        document.getElementById('summary-30d-failed').textContent = data.summary_30d.failed;

                        drawChart(data.trend);
                    } else {
                        showToast(data.message || '获取监控数据失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，无法加载监控数据');
                }
            }

            // Render Chart.js
            let trendChart = null;
            function drawChart(trend) {
                const ctx = document.getElementById('trendChart').getContext('2d');
                
                // Format YYYY-MM-DD to MM-DD for cleaner chart labels
                const labels = trend.map(item => {
                    const parts = item.date.split('-');
                    return parts.length === 3 ? `${parts[1]}-${parts[2]}` : item.date;
                });
                const counts = trend.map(item => item.count);

                if (trendChart) {
                    trendChart.destroy();
                }

                trendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '订单数量',
                            data: counts,
                            borderColor: '#4f46e5',
                            backgroundColor: 'rgba(79, 70, 229, 0.05)',
                            borderWidth: 2.5,
                            tension: 0.35,
                            fill: true,
                            pointBackgroundColor: '#4f46e5',
                            pointBorderColor: '#ffffff',
                            pointBorderWidth: 1.5,
                            pointRadius: 4,
                            pointHoverRadius: 6,
                            pointHoverBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false,
                                backgroundColor: '#0f172a',
                                titleColor: '#ffffff',
                                bodyColor: '#ffffff',
                                titleFont: {
                                    weight: 'bold'
                                },
                                padding: 12,
                                cornerRadius: 8,
                                displayColors: false
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    color: '#64748b',
                                    font: {
                                        family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto',
                                        size: 11
                                    }
                                }
                            },
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: '#f1f5f9',
                                    drawBorder: false
                                },
                                ticks: {
                                    color: '#64748b',
                                    stepSize: 1,
                                    precision: 0,
                                    font: {
                                        family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto',
                                        size: 11
                                    }
                                }
                            }
                        }
                    }
                });
            }

            // Intercept navigation links for smooth transition
            document.querySelectorAll('a.nav-item').forEach(link => {
                if (link.getAttribute('href') !== '#' && !link.classList.contains('logout')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetUrl = link.getAttribute('href');
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.remove('fade-out');
                        }
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 180);
                    });
                }
            });

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，注销失败');
                }
            });

            // Init load
            checkLogin();
        });
    </script>
</body>
</html>
