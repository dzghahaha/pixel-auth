<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>密钥转换管理 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        .textarea-box {
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            min-height: 150px;
        }
        .readonly-box {
            background-color: var(--bg-highlight);
            color: var(--text-secondary);
            cursor: default;
        }
        .summary-actions {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item active">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 管理后台 SVG 图标 -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                <span class="header-title">密钥转换管理</span>
            </div>
        </header>

        <!-- 主转换表单卡片 -->
        <div class="card convert-container">
            <div class="card-header">
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
                    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
                    <path d="M2 10h20" />
                </svg>
                <div class="card-title-group">
                    <span class="card-title">密钥转换配置</span>
                    <span class="card-subtitle">录入第三方密钥生成系统内部一对多卡密</span>
                </div>
            </div>

            <!-- 供应商选择 -->
            <div class="form-group required">
                <label for="select-vendor">选择供应商</label>
                <select id="select-vendor">
                    <option value="pass.aisale.one">pass.aisale.one</option>
                    <option value="ai.deard.fun">ai.deard.fun</option>
                </select>
            </div>

            <!-- 一对多转换乘数 -->
            <div class="form-group required">
                <label id="label-multiplier" for="input-multiplier">生成乘数（每个第三方密钥生成的系统密钥个数）</label>
                <input type="number" id="input-multiplier" min="1" value="1">
            </div>

            <!-- 第三方运营商密钥输入区 -->
            <div id="group-vendor-keys" class="form-group required">
                <label for="textarea-vendor-keys">第三方原始密钥列表（每行一个）</label>
                <textarea id="textarea-vendor-keys" class="textarea-box" placeholder="请输入第三方密钥，每行一个..."></textarea>
            </div>

            <!-- 备注 -->
            <div class="form-group">
                <label for="input-note">备注（可选）</label>
                <input type="text" id="input-note" placeholder="可输入卡密备注，如来源、渠道、批次等...">
            </div>

            <!-- 转换按钮 -->
            <button type="button" id="btn-convert" class="submit-btn">
                <!-- 闪电 SVG -->
                <svg class="star-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; margin-right: 4px; display: inline-block; vertical-align: middle;">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
                </svg>
                开始生成转换
            </button>
        </div>

        <!-- 输出展示卡片 -->
        <div class="card convert-container">
            <div class="card-header">
                <div class="card-title-group">
                    <span class="card-title">生成的系统内部密钥</span>
                    <span class="card-subtitle">用户需使用以下生成的系统内部密钥提交订单</span>
                </div>
            </div>

            <div class="form-group">
                <textarea id="textarea-system-keys" class="textarea-box readonly-box" placeholder="点击转换后，生成的系统卡密将在此处显示，每行一个..." readonly></textarea>
            </div>

            <div class="summary-actions" style="display: flex; gap: 12px; width: 100%;">
                <button type="button" id="btn-copy-sys" class="btn-submit" style="flex: 1;">
                    复制系统密钥
                </button>
                <button type="button" id="btn-export-sys" class="btn-submit" style="flex: 1;">
                    导出格式
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectVendor = document.getElementById('select-vendor');
            const inputMultiplier = document.getElementById('input-multiplier');
            const txtVendorKeys = document.getElementById('textarea-vendor-keys');
            const txtSystemKeys = document.getElementById('textarea-system-keys');
            const btnConvert = document.getElementById('btn-convert');
            const btnCopy = document.getElementById('btn-copy-sys');
            const toast = document.getElementById('toast');
            const btnLogout = document.getElementById('btn-logout');

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            // Check Login Status
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (!res.ok || !data.success) {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，注销失败');
                }
            });

            // Toggle form fields based on selected vendor
            function updateFormVisibility() {
                const vendor = selectVendor.value;
                const groupVendorKeys = document.getElementById('group-vendor-keys');
                const labelMultiplier = document.getElementById('label-multiplier');

                if (vendor === 'ai.deard.fun') {
                    groupVendorKeys.style.display = 'none';
                    labelMultiplier.textContent = '生成数量';
                } else {
                    groupVendorKeys.style.display = 'block';
                    labelMultiplier.textContent = '生成乘数（每个第三方密钥生成的系统密钥个数）';
                }
            }

            selectVendor.addEventListener('change', updateFormVisibility);
            updateFormVisibility();

            // Copy helper
            btnCopy.addEventListener('click', () => {
                const text = txtSystemKeys.value.trim();
                if (!text) {
                    showToast('没有可复制的密钥');
                    return;
                }

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('复制成功！');
                    }).catch(err => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            });

            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('复制成功！');
                } catch (err) {
                    showToast('复制失败，请手动选择复制');
                }
                document.body.removeChild(textArea);
            }

            // Export helper
            const btnExport = document.getElementById('btn-export-sys');
            btnExport.addEventListener('click', () => {
                const text = txtSystemKeys.value.trim();
                if (!text) {
                    showToast('没有可导出的密钥');
                    return;
                }
                const lines = text.split('\n').filter(l => l.trim().length > 0);
                const count = lines.length;
                
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const filename = `${year}-${month}-${day}-${count}.txt`;

                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('导出成功！');
            });

            const inputNote = document.getElementById('input-note');

            // Convert handler
            btnConvert.addEventListener('click', async () => {
                const vendor = selectVendor.value;
                const multiplier = parseInt(inputMultiplier.value, 10);
                const note = inputNote.value.trim();

                if (isNaN(multiplier) || multiplier <= 0) {
                    showToast(vendor === 'ai.deard.fun' ? '请输入有效的生成数量' : '请输入有效的生成乘数');
                    return;
                }

                let vendorKeys = [];
                if (vendor !== 'ai.deard.fun') {
                    const vendorKeysRaw = txtVendorKeys.value.trim();
                    if (!vendorKeysRaw) {
                        showToast('请输入第三方原始密钥');
                        return;
                    }
                    vendorKeys = vendorKeysRaw
                        .split('\n')
                        .map(k => k.trim())
                        .filter(k => k.length > 0);

                    if (vendorKeys.length === 0) {
                        showToast('没有有效的原始密钥');
                        return;
                    }
                }

                btnConvert.disabled = true;
                const originalText = btnConvert.innerHTML;
                btnConvert.innerText = '正在生成并入库中...';

                try {
                    const response = await fetch('/api/convert_keys', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            vendor: vendor,
                            vendor_keys: vendorKeys,
                            multiplier: multiplier,
                            note: note
                        })
                    });

                    const result = await response.json();
                    if (response.ok && result.success) {
                        const sysKeys = result.system_keys || [];
                        txtSystemKeys.value = sysKeys.join('\n');
                        showToast(`成功生成并录入 ${sysKeys.length} 个系统卡密！`);
                    } else {
                        showToast(result.message || '转换密钥失败');
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    showToast('网络错误，无法连接至服务器');
                } finally {
                    btnConvert.disabled = false;
                    btnConvert.innerHTML = originalText;
                }
            });

            // Init check
            checkLogin();
        });
    </script>
</body>
</html>
