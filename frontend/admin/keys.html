<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台密钥管理 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css?v=1.0.2">
    <script src="./admin.js?v=1.0.2"></script>
    <style>
        /* Search Panel */
        .search-combo {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        .status-select {
            min-width: 150px;
            cursor: pointer;
        }

        .time-td {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .search-combo {
                padding: 12px;
                gap: 8px;
            }
            .status-select {
                flex: 1;
            }
        }
        @media (max-width: 480px) {
            .search-combo {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- 页面加载过渡动画 -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item active">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="/admin/generate.html" class="nav-item">生成卡密</a>
            <a href="/admin/buy.html" class="nav-item">购买卡密</a>
            <a href="/admin/buy_records.html" class="nav-item">购买记录</a>
            <a href="/admin/vendors.html" class="nav-item">合作厂商</a>
            <a href="/admin/settings.html" class="nav-item">系统设置</a>
            <a href="/admin/users.html" class="nav-item">用户管理</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 密钥图标 SVG -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0 1.5 1.5M15.5 7.5 14 6" />
                </svg>
                <span class="header-title">系统卡密管理</span>
            </div>
            <div class="header-right" id="admin-user-display" style="font-size:13px; color:var(--slate-600); font-weight: 500;">
                管理员: -
            </div>
        </header>

        <!-- 搜索过滤卡片 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="search-combo">
                <input type="text" id="search-query" class="search-input" placeholder="输入系统卡密 / 运营商卡密 / 原始卡密 / 备注 搜索...">
                <select id="filter-status" class="status-select">
                    <option value="">所有状态</option>
                    <option value="active">生效中 (Active)</option>
                    <option value="inactive">已作废 (Inactive)</option>
                </select>
                <select id="filter-vendor" class="status-select admin-only">
                    <option value="">所有厂商</option>
                </select>
                <button type="button" id="btn-search" class="btn-search">搜索筛选</button>
                <button type="button" id="btn-export" class="btn-detail" style="height: 38px; padding: 0 16px; font-size: 13px; font-weight: 500; white-space: nowrap;">导出筛选卡密</button>
            </div>
        </div>

        <!-- 数据表格卡片 -->
        <div class="card">
            <div class="table-container">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>系统卡密</th>
                            <th class="admin-only">运营商</th>
                            <th class="admin-only">运营商密钥 (vendor_key)</th>
                            <th>当前状态</th>
                            <th class="admin-only">关联的原始密钥</th>
                            <th>备注</th>
                            <th>生成时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="9" style="padding: 48px 0; text-align: center;">
                                <div style="display: inline-flex; flex-direction: column; align-items: center; gap: 12px; justify-content: center; width: 100%;">
                                    <div class="loader-spinner"></div>
                                    <span style="font-size: 13px; color: var(--slate-400); font-weight: 500;">正在加载密钥数据...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页栏 -->
            <div class="pagination-container">
                <button type="button" id="btn-prev-page" class="btn-page" disabled>上一页</button>
                <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--slate-600);">
                    第 <input type="number" id="input-page-num" min="1" value="1" style="width: 52px; text-align: center; padding: 4px; border: 1px solid var(--slate-300); border-radius: 6px; font-size:13px; outline:none; font-weight: 600; color: var(--slate-900);"> / <span id="total-pages-span">1</span> 页 (共 <span id="total-count-span">0</span> 条)
                </div>
                <button type="button" id="btn-next-page" class="btn-page" disabled>下一页</button>
            </div>
        </div>
    </div>

    <!-- 重置结果弹窗 -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span>卡密重置成功</span>
                <span id="close-result-modal" class="close-btn">&times;</span>
            </div>
            <div class="modal-body" id="result-modal-body">
                <!-- 结果文本由 JS 填充 -->
            </div>
            <div class="modal-footer">
                <button type="button" id="btn-close-result" class="btn-submit">确认好的</button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('table-body');
            const searchInput = document.getElementById('search-query');
            const statusSelect = document.getElementById('filter-status');
            const vendorSelect = document.getElementById('filter-vendor');
            const btnSearch = document.getElementById('btn-search');

            const btnPrev = document.getElementById('btn-prev-page');
            const btnNext = document.getElementById('btn-next-page');
            const inputPageNum = document.getElementById('input-page-num');
            const totalPagesSpan = document.getElementById('total-pages-span');
            const totalCountSpan = document.getElementById('total-count-span');

            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');

            // Modal elements
            const resultModal = document.getElementById('result-modal');
            const closeResultModal = document.getElementById('close-result-modal');
            const btnCloseResult = document.getElementById('btn-close-result');
            const resultModalBody = document.getElementById('result-modal-body');

            let currentPage = 1;
            let totalPages = 1;
            const pageSize = 15;
            let currentKeys = [];
            let currentUserRole = ''; // Store user role globally

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            function applyRoleUI() {
                if (currentUserRole !== 'admin') {
                    document.querySelectorAll('.admin-only').forEach(el => {
                        el.style.display = 'none';
                    });
                }
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        
                        currentUserRole = data.role; // Save role globally
                        const role = data.role;
                        const permissions = data.permissions || [];
                        
                        const menuMap = {
                            '/admin/dashboard.html': 'dashboard',
                            '/admin/orders.html': 'orders',
                            '/admin/keys.html': 'keys',
                            '/admin/generate.html': 'generate',
                            '/admin/buy.html': 'buy',
                            '/admin/buy_records.html': 'buy',
                            '/admin/vendors.html': 'vendors',
                            '/admin/convert.html': 'convert',
                            '/admin/reset.html': 'reset',
                            '/admin/settings.html': 'settings',
                            '/admin/users.html': 'users'
                        };

                        document.querySelectorAll('a.nav-item').forEach(link => {
                            const href = link.getAttribute('href');
                            if (menuMap[href]) {
                                const key = menuMap[href];
                                if (role !== 'admin' && !permissions.includes(key)) {
                                    link.style.display = 'none';
                                }
                            }
                        });

                        applyRoleUI();
                        await loadKeys();
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.add('fade-out');
                        }
                    } else {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Format date
            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleString('zh-CN', { hour12: false });
            }

            // Fetch and render keys
            async function loadKeys() {
                tableBody.innerHTML = getTableLoadingHTML(9, '正在读取卡密数据...');
                const queryVal = searchInput.value.trim();
                const statusVal = statusSelect.value;
                const vendorVal = vendorSelect.value;

                try {
                    const url = `/api/admin/keys?page=${currentPage}&page_size=${pageSize}&query=${encodeURIComponent(queryVal)}&status=${statusVal}&vendor=${encodeURIComponent(vendorVal)}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        currentKeys = data.records || [];
                        const total = data.total || 0;
                        totalPages = Math.ceil(total / pageSize) || 1;

                        inputPageNum.value = currentPage;
                        totalPagesSpan.textContent = totalPages;
                        totalCountSpan.textContent = total;
                        btnPrev.disabled = currentPage <= 1;
                        btnNext.disabled = currentPage >= totalPages;

                        // Dynamically populate vendor dropdown
                        if (data.vendors) {
                            const selectedVendor = vendorSelect.value;
                            vendorSelect.innerHTML = '<option value="">所有厂商</option>';
                            data.vendors.forEach(v => {
                                const opt = document.createElement('option');
                                opt.value = v;
                                opt.textContent = v;
                                if (v === selectedVendor) {
                                    opt.selected = true;
                                }
                                vendorSelect.appendChild(opt);
                            });
                        }

                        if (currentKeys.length === 0) {
                            tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 32px; color: var(--slate-400);">暂无符合条件的卡密记录</td></tr>';
                            return;
                        }

                        tableBody.innerHTML = '';
                        currentKeys.forEach(k => {
                            const tr = document.createElement('tr');
                            
                            let statusClass = 'pending';
                            let statusText = '生效中';
                            let actionBtnHtml = '';
                            if (k.status === 'active') {
                                statusClass = 'success';
                                statusText = '生效中';
                                actionBtnHtml = `
                                    <button type="button" class="btn-reset-key" data-key="${k.system_key}">重置</button>
                                    <button type="button" class="btn-invalidate-key" data-key="${k.system_key}">作废</button>
                                `;
                            } else if (k.status === 'inactive') {
                                statusClass = 'failed';
                                statusText = '已作废';
                                actionBtnHtml = `<button type="button" class="btn-page" style="padding: 4px 8px; font-size:11px;" disabled>已作废</button>`;
                            }

                            tr.innerHTML = `
                                <td>${k.id}</td>
                                <td style="font-family: monospace; font-weight: 600; color: var(--slate-900);">${k.system_key}</td>
                                <td class="admin-only" style="font-size:13px; color: var(--slate-600);">${k.vendor || '-'}</td>
                                <td class="admin-only" style="font-family: monospace; font-size: 12px;">${k.vendor_key}</td>
                                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                                <td class="admin-only" style="font-family: monospace; font-size:12px; color: var(--slate-600);">${k.original_key || '-'}</td>
                                <td style="font-size:13px; color: var(--slate-700); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${k.note || ''}">${k.note || '-'}</td>
                                <td class="time-td">${formatDate(k.created_at)}</td>
                                <td>${actionBtnHtml}</td>
                            `;
                            tableBody.appendChild(tr);
                        });

                        // Hide admin columns dynamically
                        applyRoleUI();

                        // Bind reset event
                        document.querySelectorAll('.btn-reset-key').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const key = e.target.getAttribute('data-key');
                                resetKeyConfirm(key);
                            });
                        });

                        // Bind invalidate event
                        document.querySelectorAll('.btn-invalidate-key').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const key = e.target.getAttribute('data-key');
                                invalidateKeyConfirm(key);
                            });
                        });

                    } else {
                        showToast(data.message || '获取卡密数据失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，无法加载卡密数据');
                }
            }

            // Reset system key
            async function resetKeyConfirm(key) {
                if (!confirm(`确认要重置卡密 ${key} 吗？这会立即作废该卡密，并生成对应的全新系统卡密，原卡密的所有待处理订单将自动迁移到新卡密上。`)) {
                    return;
                }

                try {
                    const res = await fetch('/api/reset_keys', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            old_keys: [key]
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.success) {
                        const newKey = data.new_keys ? data.new_keys[0] : '';
                        resultModalBody.innerHTML = `
                            <p style="margin-bottom: 8px; font-weight: 500;">原卡密已作废：</p>
                            <div style="font-family: monospace; background: var(--slate-50); border: 1px solid var(--slate-200); padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; word-break: break-all; color: var(--slate-700);">${key}</div>
                            <p style="margin-bottom: 8px; color: var(--success-text); font-weight: 600;">已成功为您生成新卡密：</p>
                            <div style="font-family: monospace; background: var(--success-bg); border: 1px solid var(--primary-border); padding: 10px 14px; border-radius: 6px; font-weight: 700; color: var(--success-text); word-break: break-all; font-size: 14px;">${newKey}</div>
                        `;
                        resultModal.classList.remove('hidden');
                        loadKeys(); // reload keys list
                    } else {
                        alert(data.message || '重置失败，请检查该卡密是否有正在执行的后台同步任务。');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，重置密钥失败');
                }
            }

            // Invalidate system key
            async function invalidateKeyConfirm(key) {
                if (!confirm(`确认要作废卡密 ${key} 吗？作废后该卡密将无法再用于提交订单。`)) {
                    return;
                }

                try {
                    const res = await fetch('/api/admin/keys/invalidate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            system_key: key
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast(data.message || '卡密已成功作废');
                        loadKeys(); // reload keys list
                    } else {
                        alert(data.message || '作废卡密失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，作废卡密失败');
                }
            }

            // Close result modal
            function closeResult() {
                resultModal.classList.add('hidden');
            }
            closeResultModal.addEventListener('click', closeResult);
            btnCloseResult.addEventListener('click', closeResult);

            // Close modal on clicking outside content
            window.addEventListener('click', (e) => {
                if (e.target === resultModal) {
                    closeResult();
                }
            });

            // Close modal on ESC press
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeResult();
                }
            });

            // Search events
            btnSearch.addEventListener('click', () => {
                currentPage = 1;
                loadKeys();
            });
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentPage = 1;
                    loadKeys();
                }
            });
            statusSelect.addEventListener('change', () => {
                currentPage = 1;
                loadKeys();
            });
            vendorSelect.addEventListener('change', () => {
                currentPage = 1;
                loadKeys();
            });

            // Export events
            const btnExport = document.getElementById('btn-export');
            btnExport.addEventListener('click', async () => {
                const queryVal = searchInput.value.trim();
                const statusVal = statusSelect.value;
                const vendorVal = vendorSelect.value;

                btnExport.disabled = true;
                const originalText = btnExport.textContent;
                btnExport.textContent = '正在导出...';

                try {
                    const url = `/api/admin/keys?export=true&query=${encodeURIComponent(queryVal)}&status=${statusVal}&vendor=${encodeURIComponent(vendorVal)}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        const keys = data.keys || [];
                        if (keys.length === 0) {
                            showToast('没有符合条件的卡密可以导出');
                            return;
                        }
                        
                        // Create text content with one key per line
                        const textContent = keys.join('\n');
                        
                        // Download as txt file
                        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
                        const blobUrl = URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                        a.href = blobUrl;
                        a.download = `keys-export-${dateStr}.txt`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(blobUrl);
                        
                        showToast(`已成功导出 ${keys.length} 个卡密`);
                    } else {
                        showToast(data.message || '导出失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，导出失败');
                } finally {
                    btnExport.disabled = false;
                    btnExport.textContent = originalText;
                }
            });

            // Pagination events
            inputPageNum.addEventListener('change', () => {
                let val = parseInt(inputPageNum.value, 10);
                if (isNaN(val) || val < 1) {
                    val = 1;
                }
                if (val > totalPages) {
                    val = totalPages;
                }
                currentPage = val;
                loadKeys();
            });

            inputPageNum.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    inputPageNum.blur();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadKeys();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadKeys();
                }
            });

            // Intercept navigation links for smooth transition
            document.querySelectorAll('a.nav-item').forEach(link => {
                if (link.getAttribute('href') !== '#' && !link.classList.contains('logout')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetUrl = link.getAttribute('href');
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.remove('fade-out');
                        }
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 180);
                    });
                }
            });

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，注销失败');
                }
            });

            // Init load
            checkLogin();
        });
    </script>
</body>
</html>
