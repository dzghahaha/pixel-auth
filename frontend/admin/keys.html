<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台密钥管理 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css?v=1.1.0">
    <script src="./admin.js?v=1.0.8"></script>
    <style>
        /* Search Panel */
        .search-combo {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        .status-select {
            min-width: 150px;
            cursor: pointer;
        }

        .time-td {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Premium Floating Datepicker Styling */
        .datepicker-wrapper {
            position: relative;
            display: inline-block;
        }

        .datepicker-trigger {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
            gap: 8px;
            min-width: 220px;
            justify-content: space-between;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            user-select: none;
        }

        .datepicker-trigger:hover {
            border-color: #94a3b8;
        }

        .datepicker-wrapper.open .datepicker-trigger {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .datepicker-trigger .calendar-icon {
            width: 15px;
            height: 15px;
            color: var(--slate-500);
            flex-shrink: 0;
        }

        .datepicker-trigger .chevron-icon {
            width: 14px;
            height: 14px;
            color: var(--slate-400);
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .datepicker-wrapper.open .datepicker-trigger .chevron-icon {
            transform: rotate(180deg);
        }

        /* Floating Popup Window */
        .datepicker-popup {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-lg), 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 14px;
            z-index: 101;
            display: none;
            flex-direction: column;
            gap: 12px;
            min-width: 320px;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .datepicker-wrapper.open .datepicker-popup {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        /* Shortcuts inside popup */
        .popover-shortcuts {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-popover-shortcut {
            background: var(--bg-highlight);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-popover-shortcut:hover {
            background-color: var(--slate-100);
            color: var(--text-primary);
            border-color: #cbd5e1;
        }

        .btn-popover-shortcut.active {
            background-color: var(--primary-light);
            color: var(--primary);
            border-color: var(--border-focus);
        }

        .popover-divider {
            height: 1px;
            background-color: var(--border-color);
        }

        /* Inputs Row */
        .popover-inputs {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .popover-input-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .popover-input-field .field-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--slate-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .popover-inputs input {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-main);
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            width: 100%;
            cursor: default;
            box-sizing: border-box;
            font-weight: 600;
            text-align: center;
        }

        .popover-separator {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            padding-bottom: 10px;
        }

        /* Custom Calendar CSS */
        .calendar-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            margin-bottom: 4px;
        }

        .calendar-month-year {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-calendar-nav {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .btn-calendar-nav:hover {
            background-color: var(--slate-100);
            border-color: #cbd5e1;
            color: var(--text-primary);
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--slate-400);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 4px;
        }

        .calendar-days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            min-height: 160px;
        }

        .calendar-day-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.15s ease;
            position: relative;
            font-weight: 500;
        }

        .calendar-day-cell:hover {
            background-color: var(--slate-100);
            color: var(--primary);
        }

        .calendar-day-cell.outside {
            color: var(--slate-300);
        }

        .calendar-day-cell.outside:hover {
            background-color: var(--slate-50);
            color: var(--slate-400);
        }

        .calendar-day-cell.selected-start {
            background-color: var(--primary) !important;
            color: #ffffff !important;
            font-weight: 700;
            border-radius: 6px 0 0 6px;
        }

        .calendar-day-cell.selected-end {
            background-color: var(--primary) !important;
            color: #ffffff !important;
            font-weight: 700;
            border-radius: 0 6px 6px 0;
        }

        .calendar-day-cell.selected-single {
            background-color: var(--primary) !important;
            color: #ffffff !important;
            font-weight: 700;
            border-radius: 6px;
        }

        .calendar-day-cell.selected-range {
            background-color: var(--primary-light) !important;
            color: var(--primary) !important;
            border-radius: 0;
            font-weight: 600;
        }

        /* Footer buttons */
        .popover-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .btn-popover-reset {
            background: transparent;
            border: none;
            color: var(--slate-500);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .btn-popover-reset:hover {
            color: var(--danger);
        }

        .btn-popover-apply {
            background: linear-gradient(180deg, #4f46e5 0%, #4338ca 100%);
            border: 1px solid #4338ca;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.15s ease;
        }

        .btn-popover-apply:hover {
            opacity: 0.9;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .search-combo {
                padding: 12px;
                gap: 8px;
            }
            .status-select {
                flex: 1;
            }
        }
        @media (max-width: 480px) {
            .search-combo {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

        <!-- 头部区域 -->

                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0 1.5 1.5M15.5 7.5 14 6" />

                管理员: -

        <!-- 搜索过滤卡片 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="search-combo">
                <input type="text" id="search-query" class="search-input" placeholder="输入系统卡密 / 运营商卡密 / 原始卡密 / 备注 搜索...">
                <select id="filter-status" class="status-select">
                    <option value="">所有状态</option>
                    <option value="active">生效中 (Active)</option>

                </select>
                <select id="filter-vendor" class="status-select admin-only">
                    <option value="">所有厂商</option>
                </select>
                <select id="filter-creator" class="status-select admin-only">
                    <option value="">所有创建人</option>
                </select>
                <!-- Custom Datepicker Component -->
                <div class="datepicker-wrapper" id="datepicker-wrapper">
                    <!-- The Trigger (displays current selection) -->
                    <div class="datepicker-trigger" id="datepicker-trigger">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <span id="datepicker-display-value">生成时间：全部时间</span>
                        </div>
                        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                    
                    <!-- The Datepicker Popover Card -->
                    <div class="datepicker-popup" id="datepicker-popup">
                        <!-- Top Row: Shortcuts inside the popup -->
                        <div class="popover-shortcuts" id="popover-shortcuts">
                            <button type="button" class="btn-popover-shortcut" data-range="today">今天</button>
                            <button type="button" class="btn-popover-shortcut" data-range="yesterday">昨天</button>
                            <button type="button" class="btn-popover-shortcut" data-range="this_month">本月</button>
                            <button type="button" class="btn-popover-shortcut" data-range="7days">最近 7 天</button>
                            <button type="button" class="btn-popover-shortcut" data-range="30days">最近 30 天</button>
                            <button type="button" class="btn-popover-shortcut" data-range="all">全部</button>
                        </div>
                        
                        <!-- Divider -->
                        <div class="popover-divider"></div>
                        
                        <!-- Middle Row: Date Inputs -->

                        <!-- Footer actions -->

                    </div>
                </div>
                <button type="button" id="btn-search" class="btn-search">搜索筛选</button>
                <button type="button" id="btn-export" class="btn-detail" style="height: 38px; padding: 0 16px; font-size: 13px; font-weight: 500; white-space: nowrap;">导出筛选卡密</button>
            </div>

        <!-- 数据表格卡片 -->
        <div class="card">
            <div class="table-container">
                <table class="result-table">

                            <th class="admin-only">ID</th>

            <!-- 分页栏 -->

                    第 <input type="number" id="input-page-num" min="1" value="1" style="width: 52px; text-align: center; padding: 4px; border: 1px solid var(--slate-300); border-radius: 6px; font-size:13px; outline:none; font-weight: 600; color: var(--slate-900);"> / <span id="total-pages-span">1</span> 页 (共 <span id="total-count-span">0</span> 条)

    <!-- 重置结果弹窗 -->

        <div class="modal-content">

                <span>卡密重置成功</span>
                <span id="close-result-modal" class="close-btn">&times;</span>

    <!-- 弹窗提示组件 -->

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('table-body');
            const searchInput = document.getElementById('search-query');
            const statusSelect = document.getElementById('filter-status');
            const vendorSelect = document.getElementById('filter-vendor');
            const creatorSelect = document.getElementById('filter-creator');
            const btnSearch = document.getElementById('btn-search');

            const btnPrev = document.getElementById('btn-prev-page');
            const btnNext = document.getElementById('btn-next-page');
            const inputPageNum = document.getElementById('input-page-num');
            const totalPagesSpan = document.getElementById('total-pages-span');
            const totalCountSpan = document.getElementById('total-count-span');

            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');

            // Modal elements
            const resultModal = document.getElementById('result-modal');
            const closeResultModal = document.getElementById('close-result-modal');
            const btnCloseResult = document.getElementById('btn-close-result');
            const resultModalBody = document.getElementById('result-modal-body');

            // Datepicker elements
            const filterStartTime = document.getElementById('filter-start-time');
            const filterEndTime = document.getElementById('filter-end-time');
            const datepickerWrapper = document.getElementById('datepicker-wrapper');
            const datepickerTrigger = document.getElementById('datepicker-trigger');
            const datepickerPopup = document.getElementById('datepicker-popup');
            const datepickerDisplay = document.getElementById('datepicker-display-value');
            const popoverShortcuts = document.getElementById('popover-shortcuts');
            const btnPopoverReset = document.getElementById('btn-popover-reset');
            const btnPopoverApply = document.getElementById('btn-popover-apply');

            const btnPrevMonth = document.getElementById('btn-prev-month');
            const btnNextMonth = document.getElementById('btn-next-month');
            const calendarMonthYear = document.getElementById('calendar-month-year');
            const calendarDaysGrid = document.getElementById('calendar-days-grid');

            let calendarCurrentDate = new Date();
            let selectedStartDate = null;
            let selectedEndDate = null;

            // Helper to format Date object into YYYY-MM-DD
            const padNum = (n) => n.toString().padStart(2, '0');
            const toLocalDateStr = (d) => {
                return d ? `${d.getFullYear()}-${padNum(d.getMonth() + 1)}-${padNum(d.getDate())}` : '';
            };

            // Format date string for displaying in the trigger
            function updateDatePickerDisplay() {
                const start = toLocalDateStr(selectedStartDate);
                const end = toLocalDateStr(selectedEndDate);

                if (start && end) {
                    if (start === end) {
                        datepickerDisplay.textContent = `生成时间: ${start}`;
                    } else {
                        datepickerDisplay.textContent = `${start} 至 ${end}`;
                    }
                } else if (start) {
                    datepickerDisplay.textContent = `${start} 起`;
                } else if (end) {
                    datepickerDisplay.textContent = `至 ${end}`;
                } else {
                    datepickerDisplay.textContent = '生成时间：全部时间';
                }
            }

            // Sync Date selection to text fields
            function syncSelectionsToInputs() {
                filterStartTime.value = toLocalDateStr(selectedStartDate);
                filterEndTime.value = toLocalDateStr(selectedEndDate);
                updateDatePickerDisplay();
            }

            // Highlight cells inside custom calendar grid
            function highlightCell(cell, date) {
                const time = date.getTime();
                const start = selectedStartDate ? selectedStartDate.getTime() : null;
                const end = selectedEndDate ? selectedEndDate.getTime() : null;
                
                if (start && end) {
                    if (time === start) {
                        cell.classList.add('selected-start');
                    } else if (time === end) {
                        cell.classList.add('selected-end');
                    } else if (time > start && time < end) {
                        cell.classList.add('selected-range');
                    }
                } else if (start) {
                    if (time === start) {
                        cell.classList.add('selected-single');
                    }
                }
            }

            // Day cell click handler
            function handleDayClick(date) {
                const clickedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                
                if (!selectedStartDate || (selectedStartDate && selectedEndDate)) {
                    selectedStartDate = clickedDate;
                    selectedEndDate = null;
                    popoverShortcuts.querySelectorAll('.btn-popover-shortcut').forEach(b => b.classList.remove('active'));
                } else {
                    if (clickedDate < selectedStartDate) {
                        selectedStartDate = clickedDate;
                        selectedEndDate = null;
                    } else {
                        selectedEndDate = clickedDate;
                    }
                }
                
                syncSelectionsToInputs();
                renderCalendar();
            }

            // Render calendar grid
            function renderCalendar() {
                const year = calendarCurrentDate.getFullYear();
                const month = calendarCurrentDate.getMonth();
                
                calendarMonthYear.textContent = `${year}年${month + 1}月`;
                calendarDaysGrid.innerHTML = '';
                
                const firstDay = new Date(year, month, 1);
                let startDayIndex = firstDay.getDay();
                
                const totalDays = new Date(year, month + 1, 0).getDate();
                const prevMonthTotalDays = new Date(year, month, 0).getDate();
                for (let i = startDayIndex - 1; i >= 0; i--) {
                    const cell = document.createElement('div');
                    cell.className = 'calendar-day-cell outside';
                    const d = prevMonthTotalDays - i;
                    cell.textContent = d;
                    
                    const cellDate = new Date(year, month - 1, d);
                    highlightCell(cell, cellDate);
                    cell.addEventListener('click', () => handleDayClick(cellDate));
                    calendarDaysGrid.appendChild(cell);
                }
                
                for (let d = 1; d <= totalDays; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'calendar-day-cell';
                    cell.textContent = d;
                    
                    const cellDate = new Date(year, month, d);
                    highlightCell(cell, cellDate);
                    cell.addEventListener('click', () => handleDayClick(cellDate));
                    calendarDaysGrid.appendChild(cell);
                }
                
                const currentCells = startDayIndex + totalDays;
                const remainingCells = 42 - currentCells;
                for (let d = 1; d <= remainingCells; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'calendar-day-cell outside';
                    cell.textContent = d;
                    
                    const cellDate = new Date(year, month + 1, d);
                    highlightCell(cell, cellDate);
                    cell.addEventListener('click', () => handleDayClick(cellDate));
                    calendarDaysGrid.appendChild(cell);
                }
            }

            // Month navigation
            btnPrevMonth.addEventListener('click', (e) => {
                e.stopPropagation();
                calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() - 1);
                renderCalendar();
            });
            btnNextMonth.addEventListener('click', (e) => {
                e.stopPropagation();
                calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + 1);
                renderCalendar();
            });

            // Toggle popover on trigger click
            datepickerTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = datepickerWrapper.classList.contains('open');
                
                document.querySelectorAll('.custom-select').forEach(cs => {
                    cs.classList.remove('open');
                });

                if (isOpen) {
                    datepickerWrapper.classList.remove('open');
                } else {
                    datepickerWrapper.classList.add('open');
                    renderCalendar();
                }
            });

            // Prevent closing when clicking inside popover
            datepickerPopup.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            // Close popover when clicking outside
            document.addEventListener('click', () => {
                datepickerWrapper.classList.remove('open');
            });

            // Reset action
            btnPopoverReset.addEventListener('click', (e) => {
                e.stopPropagation();
                selectedStartDate = null;
                selectedEndDate = null;
                popoverShortcuts.querySelectorAll('.btn-popover-shortcut').forEach(b => b.classList.remove('active'));
                
                syncSelectionsToInputs();
                renderCalendar();
                datepickerWrapper.classList.remove('open');
                
                currentPage = 1;
                loadKeys();
            });

            // Apply action
            btnPopoverApply.addEventListener('click', (e) => {
                e.stopPropagation();
                
                datepickerWrapper.classList.remove('open');
                
                currentPage = 1;
                loadKeys();
            });

            // Shortcut clicks inside popover
            popoverShortcuts.querySelectorAll('.btn-popover-shortcut').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    popoverShortcuts.querySelectorAll('.btn-popover-shortcut').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const range = btn.getAttribute('data-range');
                    
                    if (range === 'all') {
                        selectedStartDate = null;
                        selectedEndDate = null;
                    } else {
                        const now = new Date();
                        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                        if (range === 'today') {
                            selectedStartDate = today;
                            selectedEndDate = today;
                        } else if (range === 'yesterday') {
                            const yesterday = new Date(today);
                            yesterday.setDate(today.getDate() - 1);
                            selectedStartDate = yesterday;
                            selectedEndDate = yesterday;
                        } else if (range === 'this_month') {
                            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                            selectedStartDate = firstDay;
                            selectedEndDate = today;
                        } else if (range === '7days') {
                            const daysAgo = new Date(today);
                            daysAgo.setDate(today.getDate() - 6);
                            selectedStartDate = daysAgo;
                            selectedEndDate = today;
                        } else if (range === '30days') {
                            const daysAgo = new Date(today);
                            daysAgo.setDate(today.getDate() - 29);
                            selectedStartDate = daysAgo;
                            selectedEndDate = today;
                        }
                    }

                    syncSelectionsToInputs();
                    renderCalendar();
                    datepickerWrapper.classList.remove('open');
                    
                    currentPage = 1;
                    loadKeys();
                });
            });

            let currentPage = 1;
            let totalPages = 1;
            const pageSize = 15;
            let currentKeys = [];
            let currentUserRole = ''; // Store user role globally

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            function applyRoleUI() {
                if (currentUserRole !== 'admin') {
                    document.querySelectorAll('.admin-only').forEach(el => {
                        el.style.display = 'none';
                    });
                }
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        currentUserRole = data.role; // Save role globally
                        window.applyNavPermissions(data.role, data.permissions);

                        applyRoleUI();
                        const initPromises = [loadKeys()];
                        if (data.role === 'admin') {
                            initPromises.push(loadCreators());
                        }
                        await Promise.all(initPromises);
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.add('fade-out');
                        }
                    } else {
                        window.clearAuthCache();
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.clearAuthCache();
                    window.location.href = '/admin/login.html';
                }
            }

            async function loadCreators() {
                try {
                    const res = await fetch('/api/admin/users/selector');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        const users = data.users || [];
                        const selectedCreator = creatorSelect.value;
                        creatorSelect.innerHTML = '<option value="">所有创建人</option>';
                        users.forEach(u => {
                            const opt = document.createElement('option');
                            opt.value = u.id;
                            opt.textContent = u.nickname || u.username;
                            if (u.id.toString() === selectedCreator) {
                                opt.selected = true;
                            }
                            creatorSelect.appendChild(opt);
                        });
                    }
                } catch (e) {
                    console.error('Failed to load creators:', e);
                }
            }

            // Format date
            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleString('zh-CN', { hour12: false });
            }

            // Fetch and render keys
            async function loadKeys() {
                tableBody.innerHTML = getTableLoadingHTML(10, '正在读取卡密数据...');
                const queryVal = searchInput.value.trim();
                const statusVal = statusSelect.value;
                const vendorVal = vendorSelect.value;
                const creatorVal = creatorSelect.value;
                const startVal = filterStartTime ? filterStartTime.value : '';
                const endVal = filterEndTime ? filterEndTime.value : '';

                try {
                    const url = `/api/admin/keys?page=${currentPage}&page_size=${pageSize}&query=${encodeURIComponent(queryVal)}&status=${statusVal}&vendor=${encodeURIComponent(vendorVal)}&creator_id=${creatorVal}&start_date=${encodeURIComponent(startVal)}&end_date=${encodeURIComponent(endVal)}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        currentKeys = data.records || [];
                        const total = data.total || 0;
                        totalPages = Math.ceil(total / pageSize) || 1;

                        inputPageNum.value = currentPage;
                        totalPagesSpan.textContent = totalPages;
                        totalCountSpan.textContent = total;
                        btnPrev.disabled = currentPage <= 1;
                        btnNext.disabled = currentPage >= totalPages;

                        // Dynamically populate vendor dropdown
                        if (data.vendors) {
                            const selectedVendor = vendorSelect.value;
                            vendorSelect.innerHTML = '<option value="">所有厂商</option>';
                            data.vendors.forEach(v => {
                                const opt = document.createElement('option');
                                opt.value = v;
                                opt.textContent = v;
                                if (v === selectedVendor) {
                                    opt.selected = true;
                                }
                                vendorSelect.appendChild(opt);
                            });
                        }

                        if (currentKeys.length === 0) {
                            tableBody.innerHTML = '<tr><td colspan="10" style="text-align: center; padding: 32px; color: var(--slate-400);">暂无符合条件的卡密记录</td></tr>';
                            return;
                        }

                        tableBody.innerHTML = '';
                        currentKeys.forEach(k => {
                            const tr = document.createElement('tr');
                            
                            let statusClass = 'pending';
                            let statusText = '生效中';
                            let actionBtnHtml = '';
                            if (k.status === 'active') {
                                statusClass = 'success';
                                statusText = '生效中';
                                actionBtnHtml = `
                                    <button type="button" class="btn-reset-key" data-key="${k.system_key}">重置</button>
                                    <button type="button" class="btn-invalidate-key" data-key="${k.system_key}">作废</button>
                                `;
                            } else if (k.status === 'inactive') {
                                statusClass = 'failed';
                                statusText = '已作废';
                                actionBtnHtml = `<button type="button" class="btn-page" style="padding: 4px 8px; font-size:11px;" disabled>已作废</button>`;
                            }

                            tr.innerHTML = `
                                <td class="admin-only">${k.id}</td>
                                <td style="font-family: monospace; font-weight: 600; color: var(--slate-900);">${k.system_key}</td>
                                <td class="admin-only" style="font-size:13px; color: var(--slate-600);">${k.vendor || '-'}</td>
                                <td class="admin-only" style="font-family: monospace; font-size: 12px;">${k.vendor_key}</td>
                                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                                <td class="admin-only" style="font-family: monospace; font-size:12px; color: var(--slate-600);">${k.original_key || '-'}</td>
                                <td style="font-size:13px; color: var(--slate-700); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${k.note || ''}">${k.note || '-'}</td>
                                <td class="admin-only" style="font-size:13px; color: var(--slate-600);">${k.creator_name || '-'}</td>
                                <td class="time-td">${formatDate(k.created_at)}</td>
                                <td>${actionBtnHtml}</td>
                            `;
                            tableBody.appendChild(tr);
                        });

                        // Hide admin columns dynamically
                        applyRoleUI();

                        // Bind reset event
                        document.querySelectorAll('.btn-reset-key').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const key = e.target.getAttribute('data-key');
                                resetKeyConfirm(key);
                            });
                        });

                        // Bind invalidate event
                        document.querySelectorAll('.btn-invalidate-key').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const key = e.target.getAttribute('data-key');
                                invalidateKeyConfirm(key);
                            });
                        });

                    } else {
                        showToast(data.message || '获取卡密数据失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，无法加载卡密数据');
                }
            }

            // Reset system key
            async function resetKeyConfirm(key) {
                if (!confirm(`确认要重置卡密 ${key} 吗？这会立即作废该卡密，并生成对应的全新系统卡密，原卡密的所有待处理订单将自动迁移到新卡密上。`)) {
                    return;
                }

                try {
                    const res = await fetch('/api/reset_keys', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            old_keys: [key]
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.success) {
                        const newKey = data.new_keys ? data.new_keys[0] : '';
                        resultModalBody.innerHTML = `
                            <p style="margin-bottom: 8px; font-weight: 500;">原卡密已作废：</p>
                            <div style="font-family: monospace; background: var(--slate-50); border: 1px solid var(--slate-200); padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; word-break: break-all; color: var(--slate-700);">${key}</div>
                            <p style="margin-bottom: 8px; color: var(--success-text); font-weight: 600;">已成功为您生成新卡密：</p>
                            <div style="font-family: monospace; background: var(--success-bg); border: 1px solid var(--primary-border); padding: 10px 14px; border-radius: 6px; font-weight: 700; color: var(--success-text); word-break: break-all; font-size: 14px;">${newKey}</div>
                        `;
                        resultModal.classList.remove('hidden');
                        loadKeys(); // reload keys list
                    } else {
                        alert(data.message || '重置失败，请检查该卡密是否有正在执行的后台同步任务。');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，重置密钥失败');
                }
            }

            // Invalidate system key
            async function invalidateKeyConfirm(key) {
                if (!confirm(`确认要作废卡密 ${key} 吗？作废后该卡密将无法再用于提交订单。`)) {
                    return;
                }

                try {
                    const res = await fetch('/api/admin/keys/invalidate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            system_key: key
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.success) {
                        showToast(data.message || '卡密已成功作废');
                        loadKeys(); // reload keys list
                    } else {
                        alert(data.message || '作废卡密失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，作废卡密失败');
                }
            }

            // Close result modal
            function closeResult() {
                resultModal.classList.add('hidden');
            }
            closeResultModal.addEventListener('click', closeResult);
            btnCloseResult.addEventListener('click', closeResult);

            // Close modal on clicking outside content
            window.addEventListener('click', (e) => {
                if (e.target === resultModal) {
                    closeResult();
                }
            });

            // Close modal on ESC press
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeResult();
                }
            });

            // Search events
            btnSearch.addEventListener('click', () => {
                currentPage = 1;
                loadKeys();
            });
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentPage = 1;
                    loadKeys();
                }
            });
            statusSelect.addEventListener('change', () => {
                currentPage = 1;
                loadKeys();
            });
            vendorSelect.addEventListener('change', () => {
                currentPage = 1;
                loadKeys();
            });
            creatorSelect.addEventListener('change', () => {
                currentPage = 1;
                loadKeys();
            });

            // Export events
            const btnExport = document.getElementById('btn-export');
            btnExport.addEventListener('click', async () => {
                const queryVal = searchInput.value.trim();
                const statusVal = statusSelect.value;
                const vendorVal = vendorSelect.value;
                const creatorVal = creatorSelect.value;
                const startVal = filterStartTime ? filterStartTime.value : '';
                const endVal = filterEndTime ? filterEndTime.value : '';

                btnExport.disabled = true;
                const originalText = btnExport.textContent;
                btnExport.textContent = '正在导出...';

                try {
                    const url = `/api/admin/keys?export=true&query=${encodeURIComponent(queryVal)}&status=${statusVal}&vendor=${encodeURIComponent(vendorVal)}&creator_id=${creatorVal}&start_date=${encodeURIComponent(startVal)}&end_date=${encodeURIComponent(endVal)}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        const keys = data.keys || [];
                        if (keys.length === 0) {
                            showToast('没有符合条件的卡密可以导出');
                            return;
                        }
                        
                        // Create text content with one key per line
                        const textContent = keys.join('\n');
                        
                        // Download as txt file
                        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
                        const blobUrl = URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
                        a.href = blobUrl;
                        a.download = `keys-export-${dateStr}.txt`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(blobUrl);
                        
                        showToast(`已成功导出 ${keys.length} 个卡密`);
                    } else {
                        showToast(data.message || '导出失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，导出失败');
                } finally {
                    btnExport.disabled = false;
                    btnExport.textContent = originalText;
                }
            });

            // Pagination events
            inputPageNum.addEventListener('change', () => {
                let val = parseInt(inputPageNum.value, 10);
                if (isNaN(val) || val < 1) {
                    val = 1;
                }
                if (val > totalPages) {
                    val = totalPages;
                }
                currentPage = val;
                loadKeys();
            });

            inputPageNum.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    inputPageNum.blur();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadKeys();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadKeys();
                }
            });

            // Intercept navigation links for smooth transition
            document.querySelectorAll('a.nav-item').forEach(link => {
                if (link.getAttribute('href') !== '#' && !link.classList.contains('logout')) {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetUrl = link.getAttribute('href');
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.remove('fade-out');
                        }
                        setTimeout(() => {
                            window.location.href = targetUrl;
                        }, 180);
                    });
                }
            });

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    window.clearAuthCache();
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    window.clearAuthCache();
                    showToast('网络错误，注销失败');
                }
            });

            // Init load
            checkLogin();
        });
    </script>
</body>
</html>
