<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台密钥管理 - Pixel 订阅</title>
    <link rel="stylesheet" href="./admin.css">
    <style>
        /* Search Panel */
        .search-combo {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        .status-select {
            min-width: 150px;
            cursor: pointer;
        }

        .time-td {
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* Buttons */
        .btn-reset-key {
            background-color: var(--bg-card);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.15s;
        }

        .btn-reset-key:hover {
            background-color: var(--danger);
            color: var(--bg-main);
        }

        /* Modal Dialog Box */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 26, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.hidden {
            display: none !important;
        }

        .modal-content {
            background-color: var(--bg-card);
            width: 95%;
            max-width: 460px;
            border: 1px solid var(--border-strong);
            padding: 24px;
            box-shadow: 4px 4px 0px var(--border-strong);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            font-family: Georgia, serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-strong);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header .close-btn {
            cursor: pointer;
            font-size: 24px;
            color: var(--text-secondary);
            line-height: 1;
        }

        .modal-header .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 70vh;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border-linen);
            padding-top: 12px;
        }

        .btn-cancel {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background-color: var(--bg-highlight);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .search-combo {
                padding: 12px;
                gap: 8px;
            }
            .status-select {
                flex: 1;
            }
            .modal-content {
                padding: 16px;
                gap: 12px;
            }
        }
        @media (max-width: 480px) {
            .search-combo {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item active">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 密钥图标 SVG -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z" fill="#3b82f6"/>
                </svg>
                <span class="header-title">系统密钥管理中心</span>
            </div>
            <div class="header-right" id="admin-user-display" style="font-size:13px; color:var(--slate-600); font-weight: 500;">
                管理员: -
            </div>
        </header>

        <!-- 搜索过滤卡片 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="search-combo">
                <input type="text" id="search-query" class="search-input" placeholder="输入系统卡密 / 运营商卡密 / 原始卡密 / 备注 搜索...">
                <select id="filter-status" class="status-select">
                    <option value="">所有状态</option>
                    <option value="active">生效中 (Active)</option>
                    <option value="inactive">已作废 (Inactive)</option>
                </select>
                <button type="button" id="btn-search" class="btn-search">搜索筛选</button>
            </div>
        </div>

        <!-- 数据表格卡片 -->
        <div class="card">
            <div class="table-container">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>系统卡密</th>
                            <th>运营商</th>
                            <th>运营商密钥 (vendor_key)</th>
                            <th>当前状态</th>
                            <th>关联的原始密钥</th>
                            <th>备注</th>
                            <th>生成时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 32px; color: var(--slate-400);">正在加载密钥数据...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页栏 -->
            <div class="pagination-container">
                <button type="button" id="btn-prev-page" class="btn-page" disabled>上一页</button>
                <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--slate-600);">
                    第 <input type="number" id="input-page-num" min="1" value="1" style="width: 52px; text-align: center; padding: 4px; border: 1px solid var(--slate-300); border-radius: 6px; font-size:13px; outline:none; font-weight: 600; color: var(--slate-900);"> / <span id="total-pages-span">1</span> 页 (共 <span id="total-count-span">0</span> 条)
                </div>
                <button type="button" id="btn-next-page" class="btn-page" disabled>下一页</button>
            </div>
        </div>
    </div>

    <!-- 重置结果弹窗 -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span>卡密重置成功</span>
                <span id="close-result-modal" class="close-btn">&times;</span>
            </div>
            <div class="modal-body" id="result-modal-body">
                <!-- 结果文本由 JS 填充 -->
            </div>
            <div class="modal-footer">
                <button type="button" id="btn-close-result" class="btn-submit">确认好的</button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('table-body');
            const searchInput = document.getElementById('search-query');
            const statusSelect = document.getElementById('filter-status');
            const btnSearch = document.getElementById('btn-search');

            const btnPrev = document.getElementById('btn-prev-page');
            const btnNext = document.getElementById('btn-next-page');
            const inputPageNum = document.getElementById('input-page-num');
            const totalPagesSpan = document.getElementById('total-pages-span');
            const totalCountSpan = document.getElementById('total-count-span');

            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');

            // Modal elements
            const resultModal = document.getElementById('result-modal');
            const closeResultModal = document.getElementById('close-result-modal');
            const btnCloseResult = document.getElementById('btn-close-result');
            const resultModalBody = document.getElementById('result-modal-body');

            let currentPage = 1;
            let totalPages = 1;
            const pageSize = 15;
            let currentKeys = [];

            // Toast helper
            function showToast(message, duration = 2000) {
                toast.textContent = message;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, duration);
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        loadKeys();
                    } else {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Format date
            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleString('zh-CN', { hour12: false });
            }

            // Fetch and render keys
            async function loadKeys() {
                tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 32px; color: var(--slate-400);">正在读取卡密数据...</td></tr>';
                const queryVal = searchInput.value.trim();
                const statusVal = statusSelect.value;

                try {
                    const url = `/api/admin/keys?page=${currentPage}&page_size=${pageSize}&query=${encodeURIComponent(queryVal)}&status=${statusVal}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        currentKeys = data.records || [];
                        const total = data.total || 0;
                        totalPages = Math.ceil(total / pageSize) || 1;

                        inputPageNum.value = currentPage;
                        totalPagesSpan.textContent = totalPages;
                        totalCountSpan.textContent = total;
                        btnPrev.disabled = currentPage <= 1;
                        btnNext.disabled = currentPage >= totalPages;

                        if (currentKeys.length === 0) {
                            tableBody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 32px; color: var(--slate-400);">暂无符合条件的卡密记录</td></tr>';
                            return;
                        }

                        tableBody.innerHTML = '';
                        currentKeys.forEach(k => {
                            const tr = document.createElement('tr');
                            
                            let statusClass = 'pending';
                            let statusText = '生效中';
                            let actionBtnHtml = '';
                            if (k.status === 'active') {
                                statusClass = 'success';
                                statusText = '生效中';
                                actionBtnHtml = `<button type="button" class="btn-reset-key" data-key="${k.system_key}">重置</button>`;
                            } else if (k.status === 'inactive') {
                                statusClass = 'failed';
                                statusText = '已作废';
                                actionBtnHtml = `<button type="button" class="btn-page" style="padding: 4px 8px; font-size:11px;" disabled>已作废</button>`;
                            }

                            tr.innerHTML = `
                                <td>${k.id}</td>
                                <td style="font-family: monospace; font-weight: 600; color: var(--slate-900);">${k.system_key}</td>
                                <td style="font-size:13px; color: var(--slate-600);">${k.vendor || '-'}</td>
                                <td style="font-family: monospace; font-size: 12px;">${k.vendor_key}</td>
                                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                                <td style="font-family: monospace; font-size:12px; color: var(--slate-600);">${k.original_key || '-'}</td>
                                <td style="font-size:13px; color: var(--slate-700); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${k.note || ''}">${k.note || '-'}</td>
                                <td class="time-td">${formatDate(k.created_at)}</td>
                                <td>${actionBtnHtml}</td>
                            `;
                            tableBody.appendChild(tr);
                        });

                        // Bind reset event
                        document.querySelectorAll('.btn-reset-key').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                const key = e.target.getAttribute('data-key');
                                resetKeyConfirm(key);
                            });
                        });

                    } else {
                        showToast(data.message || '获取卡密数据失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，无法加载卡密数据');
                }
            }

            // Reset system key
            async function resetKeyConfirm(key) {
                if (!confirm(`确认要重置卡密 ${key} 吗？这会立即作废该卡密，并生成对应的全新系统卡密，原卡密的所有待处理订单将自动迁移到新卡密上。`)) {
                    return;
                }

                try {
                    const res = await fetch('/api/reset_keys', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            old_keys: [key]
                        })
                    });

                    const data = await res.json();
                    if (res.ok && data.success) {
                        const newKey = data.new_keys ? data.new_keys[0] : '';
                        resultModalBody.innerHTML = `
                            <p style="margin-bottom: 8px; font-weight: 500;">原卡密已作废：</p>
                            <div style="font-family: monospace; background: var(--slate-50); border: 1px solid var(--slate-200); padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; word-break: break-all; color: var(--slate-700);">${key}</div>
                            <p style="margin-bottom: 8px; color: var(--success-text); font-weight: 600;">已成功为您生成新卡密：</p>
                            <div style="font-family: monospace; background: var(--success-bg); border: 1px solid var(--primary-border); padding: 10px 14px; border-radius: 6px; font-weight: 700; color: var(--success-text); word-break: break-all; font-size: 14px;">${newKey}</div>
                        `;
                        resultModal.classList.remove('hidden');
                        loadKeys(); // reload keys list
                    } else {
                        alert(data.message || '重置失败，请检查该卡密是否有正在执行的后台同步任务。');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，重置密钥失败');
                }
            }

            // Close result modal
            function closeResult() {
                resultModal.classList.add('hidden');
            }
            closeResultModal.addEventListener('click', closeResult);
            btnCloseResult.addEventListener('click', closeResult);

            // Search events
            btnSearch.addEventListener('click', () => {
                currentPage = 1;
                loadKeys();
            });
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    currentPage = 1;
                    loadKeys();
                }
            });

            // Pagination events
            inputPageNum.addEventListener('change', () => {
                let val = parseInt(inputPageNum.value, 10);
                if (isNaN(val) || val < 1) {
                    val = 1;
                }
                if (val > totalPages) {
                    val = totalPages;
                }
                currentPage = val;
                loadKeys();
            });

            inputPageNum.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    inputPageNum.blur();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadKeys();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadKeys();
                }
            });

            // Logout event
            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    if (res.ok) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast('注销登录失败');
                    }
                } catch (e) {
                    console.error(e);
                    showToast('网络错误，注销失败');
                }
            });

            // Init load
            checkLogin();
        });
    </script>
</body>
</html>
