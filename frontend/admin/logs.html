<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系统日志 - Pixel 订阅管理</title>
    <link rel="stylesheet" href="./admin.css?v=1.0.2">
    <script src="./admin.js?v=1.0.2"></script>
    <style>
        .badge-info {
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-warn {
            background-color: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
        }
        .mono-text {
            font-family: var(--font-mono, "JetBrains Mono", Menlo, Monaco, monospace);
            font-size: 12px;
        }
        .message-cell {
            font-family: var(--font-mono, "JetBrains Mono", Menlo, Monaco, monospace);
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <!-- 页面加载过渡动画 -->
    <div id="page-loader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="app-container">
        <!-- 导航菜单 -->
        <nav class="admin-nav">
            <a href="/admin/dashboard.html" class="nav-item">仪表盘</a>
            <a href="/admin/orders.html" class="nav-item">订单管理</a>
            <a href="/admin/keys.html" class="nav-item">密钥管理</a>
            <a href="/admin/convert.html" class="nav-item">密钥转换</a>
            <a href="/admin/reset.html" class="nav-item">卡密重置</a>
            <a href="/admin/generate.html" class="nav-item">生成卡密</a>
            <a href="/admin/buy.html" class="nav-item">购买卡密</a>
            <a href="/admin/buy_records.html" class="nav-item">购买记录</a>
            <a href="/admin/vendors.html" class="nav-item">合作厂商</a>
            <a href="/admin/logs.html" class="nav-item active">系统日志</a>
            <a href="/admin/settings.html" class="nav-item">系统设置</a>
            <a href="/admin/users.html" class="nav-item">用户管理</a>
            <a href="#" id="btn-logout" class="nav-item logout">退出登录</a>
        </nav>

        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 日志图标 SVG -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
                <span class="header-title">系统运行日志</span>
            </div>
            <div class="header-right" id="admin-user-display" style="font-size:13px; color:var(--slate-600); font-weight: 500;">
                管理员: -
            </div>
        </header>

        <!-- 搜索过滤卡片 -->
        <div class="card" style="margin-bottom: 20px;">
            <div class="search-combo">
                <input type="text" id="search-task-id" class="search-input" style="max-width: 200px;" placeholder="筛选任务ID (Task ID)...">
                <input type="text" id="search-query" class="search-input" placeholder="输入日志内容搜索...">
                <select id="filter-level" class="status-select">
                    <option value="">所有级别</option>
                    <option value="info">INFO</option>
                    <option value="warn">WARN</option>
                    <option value="error">ERROR</option>
                </select>
                <button type="button" id="btn-search" class="btn-search">搜索筛选</button>
            </div>
        </div>

        <!-- 数据表格卡片 -->
        <div class="card">
            <div class="table-container">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th style="width: 170px;">时间</th>
                            <th style="width: 100px;">级别</th>
                            <th style="width: 160px;">任务ID</th>
                            <th>日志详情</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td colspan="5" style="padding: 48px 0; text-align: center;">
                                <div style="display: inline-flex; flex-direction: column; align-items: center; gap: 12px; justify-content: center; width: 100%;">
                                    <div class="loader-spinner"></div>
                                    <span style="font-size: 13px; color: var(--slate-400); font-weight: 500;">正在加载日志数据...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页栏 -->
            <div class="pagination-container">
                <button type="button" id="btn-prev-page" class="btn-page" disabled>上一页</button>
                <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--slate-600);">
                    <span>第</span>
                    <input type="number" id="input-page-num" class="page-input" value="1" min="1">
                    <span>/ <span id="span-total-pages">1</span> 页</span>
                    <span style="margin-left: 8px; color: var(--slate-400); font-weight: 400;">(共 <span id="span-total-count">0</span> 条)</span>
                </div>
                <button type="button" id="btn-next-page" class="btn-page" disabled>下一页</button>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const adminUserDisplay = document.getElementById('admin-user-display');
            const btnLogout = document.getElementById('btn-logout');
            const toast = document.getElementById('toast');
            
            const searchTaskId = document.getElementById('search-task-id');
            const searchInput = document.getElementById('search-query');
            const levelSelect = document.getElementById('filter-level');
            const btnSearch = document.getElementById('btn-search');
            
            const tableBody = document.getElementById('table-body');
            
            const btnPrev = document.getElementById('btn-prev-page');
            const btnNext = document.getElementById('btn-next-page');
            const inputPageNum = document.getElementById('input-page-num');
            const totalPagesSpan = document.getElementById('span-total-pages');
            const totalCountSpan = document.getElementById('span-total-count');

            let currentPage = 1;
            let totalPages = 1;
            const pageSize = 20;

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }

            // Check admin login
            async function checkLogin() {
                try {
                    const res = await fetch('/api/admin/check');
                    const data = await res.json();
                    if (res.ok && data.success) {
                        adminUserDisplay.textContent = `管理员: ${data.username}`;
                        const role = data.role;
                        const permissions = data.permissions || [];

                        const menuMap = {
                            '/admin/dashboard.html': 'dashboard',
                            '/admin/orders.html': 'orders',
                            '/admin/keys.html': 'keys',
                            '/admin/generate.html': 'generate',
                            '/admin/buy.html': 'buy',
                            '/admin/buy_records.html': 'buy',
                            '/admin/vendors.html': 'vendors',
                            '/admin/logs.html': 'logs',
                            '/admin/convert.html': 'convert',
                            '/admin/reset.html': 'reset',
                            '/admin/settings.html': 'settings',
                            '/admin/users.html': 'users'
                        };

                        document.querySelectorAll('a.nav-item').forEach(link => {
                            const href = link.getAttribute('href');
                            if (menuMap[href]) {
                                const key = menuMap[href];
                                if (role !== 'admin' && !permissions.includes(key)) {
                                    link.style.display = 'none';
                                }
                            }
                        });

                        await loadLogs();
                        const loader = document.getElementById('page-loader');
                        if (loader) {
                            loader.classList.add('fade-out');
                        }
                    } else {
                        window.location.href = '/admin/login.html';
                    }
                } catch (e) {
                    console.error(e);
                    window.location.href = '/admin/login.html';
                }
            }

            // Format date
            function formatDate(dateStr) {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleString('zh-CN', { hour12: false });
            }

            // Fetch and render logs
            async function loadLogs() {
                tableBody.innerHTML = getTableLoadingHTML(5, '正在读取日志数据...');
                const taskVal = searchTaskId.value.trim();
                const queryVal = searchInput.value.trim();
                const levelVal = levelSelect.value;

                try {
                    const url = `/api/admin/logs?page=${currentPage}&page_size=${pageSize}&task_id=${encodeURIComponent(taskVal)}&query=${encodeURIComponent(queryVal)}&level=${levelVal}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (res.ok && data.success) {
                        const logs = data.records || [];
                        const total = data.total || 0;
                        totalPages = Math.ceil(total / pageSize) || 1;

                        inputPageNum.value = currentPage;
                        totalPagesSpan.textContent = totalPages;
                        totalCountSpan.textContent = total;
                        btnPrev.disabled = currentPage <= 1;
                        btnNext.disabled = currentPage >= totalPages;

                        if (logs.length === 0) {
                            tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 32px; color: var(--slate-400);">暂无符合条件的日志记录</td></tr>';
                            return;
                        }

                        tableBody.innerHTML = '';
                        logs.forEach(log => {
                            const tr = document.createElement('tr');
                            
                            let levelBadgeClass = 'badge-info';
                            const lowerLevel = (log.level || '').toLowerCase();
                            if (lowerLevel === 'error') {
                                levelBadgeClass = 'badge-error';
                            } else if (lowerLevel === 'warn' || lowerLevel === 'warning') {
                                levelBadgeClass = 'badge-warn';
                            }

                            tr.innerHTML = `
                                <td>${log.id}</td>
                                <td>${formatDate(log.created_at)}</td>
                                <td><span class="${levelBadgeClass}">${log.level}</span></td>
                                <td class="mono-text">${log.task_id || '-'}</td>
                                <td class="message-cell">${log.message || ''}</td>
                            `;
                            tableBody.appendChild(tr);
                        });
                    } else {
                        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 32px; color: var(--danger);">加载失败: ${data.message || '未知错误'}</td></tr>`;
                    }
                } catch (error) {
                    console.error(error);
                    tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 32px; color: var(--danger);">请求失败，请检查网络连接</td></tr>`;
                }
            }

            // Event Listeners
            btnSearch.addEventListener('click', () => {
                currentPage = 1;
                loadLogs();
            });

            [searchTaskId, searchInput].forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        currentPage = 1;
                        loadLogs();
                    }
                });
            });

            levelSelect.addEventListener('change', () => {
                currentPage = 1;
                loadLogs();
            });

            btnPrev.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    loadLogs();
                }
            });

            btnNext.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    loadLogs();
                }
            });

            inputPageNum.addEventListener('change', () => {
                let page = parseInt(inputPageNum.value);
                if (isNaN(page) || page < 1) {
                    page = 1;
                }
                if (page > totalPages) {
                    page = totalPages;
                }
                currentPage = page;
                loadLogs();
            });

            btnLogout.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch('/api/admin/logout', { method: 'POST' });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        window.location.href = '/admin/login.html';
                    } else {
                        showToast(data.message || '退出登录失败');
                    }
                } catch (err) {
                    showToast('请求失败，请稍后重试');
                }
            });

            // Start check
            checkLogin();
        });
    </script>
</body>
</html>
