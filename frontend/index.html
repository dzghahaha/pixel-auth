<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel 订阅</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部区域 -->
        <header class="app-header">
            <div class="header-left">
                <!-- 菱形图标 SVG -->
                <svg class="diamond-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 12L12 22L22 12L12 2Z" fill="#007aff" stroke="#007aff" stroke-width="2" stroke-linejoin="round"/>
                </svg>
                <span class="header-title">Pixel 订阅</span>
            </div>
            <div class="header-right"></div>
        </header>

        <!-- 黄色警示横幅模块 -->
        <div class="warning-banner">
            <div class="warning-banner-top">
                <!-- 黄色三角感叹号图标 SVG -->
                <svg class="warning-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L1 21H23L12 2Z" fill="#ffcc00"/>
                    <path d="M12 9V14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="17" r="1.25" fill="#ffffff"/>
                </svg>
                <div class="warning-text-group">
                    <span class="warning-main-text">使用前请务必完成以下步骤</span>
                    <span class="warning-sub-text">完成后再提交，可显著降低处理失败风险</span>
                </div>
            </div>
            <div class="steps-container">
                <a href="https://www.yuque.com/taozi-khqsp/rrub4i/fxm5dgln1rh5iwd1" target="_blank" class="step-card" style="text-decoration: none; color: inherit; display: flex; width: 100%;">
                    <span class="step-desc">开启二步验证 查看教程</span>
                </a>
            </div>
        </div>

        <!-- 卡密主表单卡片 -->
        <div class="card form-card">
            <!-- 标题区域 -->
            <div class="card-header">
                <!-- 购物车图标 SVG -->
                <svg class="cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 3H5L5.4 5M5.4 5H21L19 13H7M5.4 5L7 13M7 13L6 17H19" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="9" cy="20" r="1" fill="#333333"/>
                    <circle cx="17" cy="20" r="1" fill="#333333"/>
                </svg>
                <div class="card-title-group">
                    <span class="card-title">卡密</span>
                    <span class="card-subtitle">支持：1. 订阅 + 绑卡 2. 获取优惠链接 3. 反重力过扫码</span>
                </div>
            </div>

            <!-- 卡密输入 -->
            <div class="form-group">
                <input type="text" id="card-secret" placeholder="请输入卡密" required>
            </div>

            <!-- 双切换按钮 -->
            <div class="toggle-container">
                <button type="button" id="btn-mode-single" class="toggle-btn active">单账号提交</button>
                <button type="button" id="btn-mode-batch" class="toggle-btn">批量提交</button>
            </div>

            <!-- 单账号输入项 -->
            <div id="single-fields" class="dynamic-fields">
                <div class="form-group required">
                    <label>账号</label>
                    <input type="text" id="username" placeholder="请输入账号（邮箱/用户名）">
                </div>
                <div class="form-group required">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码">
                </div>
                <div class="form-group required">
                    <label>身份验证器密钥 (2FA) 或 8 位备用验证码</label>
                    <label>例如：JBSW Y3DP EHPK 3PXP XXXX XXXX XXXX XXXX 或 1234 4567</label>
                    <input type="text" id="two-factor" placeholder="请输入2FA密钥或8位验证码">
                </div>
            </div>

            <!-- 批量提交输入项 -->
            <div id="batch-fields" class="dynamic-fields hidden">
                <div class="form-group required">
                    <label>批量账号数据</label>
                    <textarea id="batch-data" placeholder="每行一个账号，支持的格式：
邮箱--密码--2FA
邮箱--密码--辅助邮箱--2FA
支持的分隔符：|,----,---,--,-"></textarea>
                </div>
            </div>

            <!-- 提示行 -->
            <div class="info-row">
                <!-- 文档图标 SVG -->
                <svg class="doc-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 2H6C4.9 2 4.01 2.9 4.01 4L4 20C4 21.1 4.89 22 5.99 22H18C19.1 22 20 21.1 20 20V8L14 2ZM16 18H8V16H16V18ZM16 14H8V12H16V14ZM13 9V3.5L18.5 9H13Z" fill="#ff3b30"/>
                </svg>
                <span class="info-text">每次提交前，请务必确保支付资料已关闭</span>
            </div>

            <!-- 提交大按钮 -->
            <button type="button" id="btn-submit" class="submit-btn">
                <!-- 绿色星标 SVG -->
                <svg class="star-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" fill="#34c759"/>
                </svg>
                <span>提交处理</span>
            </button>
        </div>

        <!-- 底部查询模块 -->
        <div class="card query-card">
            <div class="query-combo">
                <input type="text" id="query-card-secret" placeholder="输入卡密查询状态">
                <button type="button" id="btn-query" class="query-btn">查询</button>
            </div>
            
            <!-- 查询结果容器 -->
            <div id="query-results" class="query-results-container hidden"></div>

            <div class="info-bar">
                <!-- 放大镜图标 SVG -->
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="11" cy="11" r="8" stroke="#007aff" stroke-width="2"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="#007aff" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="info-bar-text">开放查询・输入卡密即可查看订单</span>
            </div>
        </div>
    </div>

    <!-- 弹窗提示组件 -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
